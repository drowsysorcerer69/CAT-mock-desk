    return {id:q.id,n:i+1,sec:q.sec,secName:p.sections[q.sec].name,type:q.type,topic:q.topic,sub:q.sub||'',difficulty:q.difficulty,status:st,given,marks:q.marks,neg:q.neg,got:st==='correct'?q.marks:(st==='wrong'?-q.neg:0),time,visits:1,ch:0,mk:false,first:given,firstOk:given==null?null:st==='correct'};
  });
  if(!any){L.msg={t:'err',m:'Enter at least one answer first.'};renderLog();return}
  const score=qs.reduce((a,x)=>a+x.got,0),correct=qs.filter(x=>x.status==='correct').length,wrong=qs.filter(x=>x.status==='wrong').length;
  const att={id:uid('a_'),kind:'attempt',paperId:p.id,title:p.title,date:new Date((L.date||new Date().toISOString().slice(0,10))+'T12:00:00').getTime(),mode:'cat',imported:true,noTime:!anyTime,qs,tags:{},
    secs:p.sections.map((s,i)=>({name:s.name,minutes:s.minutes,used:qs.filter(x=>x.sec===i).reduce((a,x)=>a+x.time,0)})),
    score,max:paperMax(p),correct,wrong,attempted:correct+wrong,accuracy:pct(correct,correct+wrong)};

};

<script>
/* ---------- PDF/text -> draft paper (rule based) ---------- */
function parseExamPages(pages){
  const warnings=[];
  const first=(pages[0]||[]).find(l=>l.t&&l.t.trim());
  let title=first?first.t.trim():'Imported paper';
  const np=pages.length,freq={};
  pages.forEach(pg=>{new Set(pg.map(l=>l.t.trim())).forEach(t=>{freq[t]=(freq[t]||0)+1})});
  let lines=[];
  pages.forEach((pg,pi)=>pg.forEach(l=>{
    const t=(l.t||'').replace(/\s+/g,' ').trim();if(!t)return;
    if(/^page\s+\d+(\s+of\s+\d+)?$/i.test(t)||/^[-–\s]*\d{1,3}[-–\s]*$/.test(t)&&t.length<6)return;
    if(np>=3&&freq[t]>=Math.max(3,Math.ceil(np*0.6))&&t.length<90)return;
    lines.push({t,x:+l.x||0,para:!!l.para,pg:pi});
  }));
  /* margin: most common smallest x */
  const xs=lines.map(l=>Math.round(l.x)).filter(x=>x>0).sort((a,b)=>a-b);
  const margin=xs.length?xs[Math.floor(xs.length*0.08)]:0;
  const hasX=xs.length>10;
  /* split off the answer key */
  const keyRe=/^(answer\s*key(?:\s*(?:&|and)\s*(?:explanations?|solutions?))?|answers?\s*(?:&|and)\s*(?:explanations?|solutions?)|solutions?\s*(?:&|and)\s*(?:answers?|explanations?)|answers?\s*and\s*solutions|answers|explanations|solutions)\s*[:.]?$/i;
  let keyIdx=-1;
  for(let i=Math.floor(lines.length*0.2);i<lines.length;i++){if(lines[i].t.length<70&&/^[A-Z]/.test(lines[i].t)&&(lines[i].para||i===0||/key/i.test(lines[i].t))&&keyRe.test(lines[i].t)){keyIdx=i;break}}
  const body=keyIdx>=0?lines.slice(0,keyIdx):lines,keyL=keyIdx>=0?lines.slice(keyIdx+1):[];
  /* ----- answer key ----- */
  const key={};
  const num='\\d+(?:\\.\\d+)?';
  const startA=new RegExp('^(?:Q(?:uestion)?\\.?\\s*)?(\\d{1,3})\\s*[.):\\-–]?\\s*(?:Answer|Ans\\.?|Correct\\s*answer|Correct\\s*option)\\s*(?:is)?\\s*[:\\-–]?\\s*\\(?([A-Da-d](?![A-Za-z])|'+num+'(?:\\s*[,/]\\s*'+num+')*)\\)?\\.?\\s*(.*)$','i');
  const tok=/(?:^|[\s,;(])(\d{1,3})\s*[-–:=.)]\s*\(?([A-Da-d](?![A-Za-z\d])|\d{1,6}(?:\.\d+)?(?![\d]))\)?(?=[\s,;.)]|$)/g;
  keyL.forEach(l=>{let m,c=[];tok.lastIndex=0;while((m=tok.exec(l.t)))c.push(m);if(c.length>=4)c.forEach(m=>{if(!key[+m[1]])key[+m[1]]={a:m[2]}})});
  let curK=null;
  keyL.forEach((l,i)=>{
    const m=startA.exec(l.t);
    if(m){curK={a:m[2],sol:m[3]||''};key[+m[1]]=curK;return}
    const b=/^\s*(?:Q\.?\s*)?(\d{1,3})\s*[.):\-–]\s*\(?([A-Da-d])\)?\s*(?:[.,;]|$)/.exec(l.t);
    if(b&&!key[+b[1]]){key[+b[1]]={a:b[2]};curK=key[+b[1]];return}
    if(curK){
      if(/^(Passage \d+|Section \d+|[A-Za-z ]{3,40}:?\s*Explanations?|Verbal Ability.*|Reading Comprehension.*)$/i.test(l.t)&&l.t.length<90)return;
      if(/^Quick key/i.test(l.t))return;
      curK.sol=((curK.sol||'')+' '+l.t).trim();
    }
  });
  /* ----- document level hints ----- */
  const head=body.slice(0,40).map(l=>l.t).join(' ');
  const tokenM=/\b(VARC|DILR|LRDI|QA|QUANT(?:ITATIVE)?)\b/i.exec(title+' '+head.slice(0,300));
  const minutesM=/(\d{2,3})\s*(?:minutes|mins?)\b/i.exec(head);
  const marksM=/\+\s*(\d+(?:\.\d+)?)\s*(?:marks?\s*)?(?:for\s*(?:a\s*)?correct)/i.exec(head);
  const negM=/[−\-–]\s*(\d+(?:\.\d+)?)\s*(?:marks?\s*)?(?:for\s*(?:a\s*)?(?:wrong|incorrect))/i.exec(head);
  const defMarks=marksM?+marksM[1]:3,defNeg=negM?+negM[1]:1;
  const diffDoc=/\b(difficult|hard|tough)\b/i.test(title)?'hard':/\beasy\b/i.test(title)?'easy':'medium';
  /* ----- body walk ----- */
  const secHeads=body.filter(l=>/^Section\s*[A-Z0-9IVX]+\s*[:\-–.]/i.test(l.t)).length;
  const singleName=tokenM?(/^QUANT/i.test(tokenM[1])?'QA':tokenM[1].toUpperCase().replace('LRDI','DILR')):null;
  const multi=!singleName&&secHeads>=2;
  const sections=[];let secIdx=-1;
  const newSection=(name,mins)=>{sections.push({name,minutes:mins||40});secIdx=sections.length-1};
  const canon=n=>/verbal|reading|varc/i.test(n)?'VARC':/data\s*interp|logical|dilr|lrdi/i.test(n)?'DILR':/quant|\bqa\b|arithmetic/i.test(n)?'QA':n;
  if(!multi)newSection(singleName||'Section 1',minutesM?+minutesM[1]:40);
  const topicGroups=[],passages=[];
  let curPassage=null,pendPass=null,loose=[],curDir='',dirMode=false,mode='pre',cur=null,expected=1,justSection=false;
  const qs=[];
  const joinInto=(arr,l)=>{if(!arr.length||l.para)arr.push(l.t);else arr[arr.length-1]+=' '+l.t};
  const closeQ=()=>{if(cur){qs.push(cur);cur=null}};
  const closePass=()=>{if(pendPass){const text=pendPass.paras.join('\n\n').trim();if(text){curPassage={text,to:pendPass.to||Infinity,from:pendPass.from||0}}pendPass=null}};
  const optRe=/^[•·▪◦●‣*–-]?\s*(?:\(([A-Ha-h])\)|([A-Ha-h])[.)])\s*(.*)$/;
  const qRe=/^(?:(?:Q(?:uestion)?)\.?\s*)?(\d{1,3})\s*[.):]\s*(.*)$/i;
  const qWord=/^(?:Q|Question)\.?\s*\d/i;
  for(let i=0;i<body.length;i++){
    const l=body[i],t=l.t;let m;
    /* headings */
    if((m=/^Section\s*([A-Z0-9IVX]+)\s*[:\-–.]\s*(.+)$/i.exec(t))){
      closeQ();closePass();curPassage=null;curDir='';dirMode=false;justSection=true;
      const rg=/\(\s*Questions?\s*(\d+)\s*[-–to]+\s*(\d+)\s*\)/i.exec(m[2]);
      let nm=m[2].replace(/\(.*?\)/g,'').replace(/\s*[—–-]\s*.*$/,'').trim();
      const mins=/(\d{2,3})\s*min/i.exec(m[2]);
      if(multi)newSection(canon(nm),mins?+mins[1]:40);
      else if(rg)topicGroups.push({from:+rg[1],to:+rg[2],name:nm});
      mode='pre';continue;
    }
    if((m=/^Passage\s*([0-9IVX]+)?\s*(?:[(\[]?\s*Questions?\s*(\d+)\s*[-–to]+\s*(\d+)\s*[)\]]?)?\s*[:.\-–]?\s*(.*)$/i.exec(t))&&t.length<130&&/^Passage\b/i.test(t)&&(!m[4]||m[4].length<60)){
      closeQ();closePass();curPassage=null;curDir='';dirMode=false;
      pendPass={paras:[],from:m[2]?+m[2]:0,to:m[3]?+m[3]:0};mode='passage';continue;
    }
    if(!cur&&(m=/^(.{3,70}?)\s*\(\s*Questions?\s*(\d+)\s*[-–to]+\s*(\d+)\s*\)\s*(?:[—–-]+\s*(.*))?$/i.exec(t))&&!/^Passage/i.test(t)){
      closeQ();closePass();curPassage=null;curDir='';dirMode=false;
      topicGroups.push({from:+m[2],to:+m[3],name:m[1].trim(),hint:(m[4]||'').trim()});mode='pre';continue;
    }
    if((m=/^Directions?\s*[:.\-–]\s*(.*)$/i.exec(t))){
      closeQ();closePass();curDir=m[1];dirMode=true;continue;
    }
    /* question start */
    let qm=qRe.exec(t);
    if(!qm&&(m=/^Question\s+(\d{1,3})\s*(.*)$/i.exec(t)))qm=[t,m[1],m[2]];
    if(qm){
      const n=+qm[1],hasQ=qWord.test(t);
      const ok=(hasQ&&n>=1)||n===expected||(n===1&&justSection);
      const inStem=cur&&cur.options.length===0&&!hasQ&&n!==expected;
      if(ok&&!inStem&&!(cur&&!hasQ&&n===expected&&cur.options.length===0&&cur.stemLines.length>0&&/^\d$/.test(String(n))&&expected<=4&&cur.n>=10)){
        closeQ();dirMode=false;justSection=false;
        if(mode==='passage')closePass();
        if(!curPassage&&loose.join(' ').length>=400)curPassage={text:loose.join('\n\n'),to:Infinity,from:0};
        loose=[];
        const pas=curPassage&&(curPassage.to===Infinity?true:(n<=curPassage.to&&n>=(curPassage.from||0)))?curPassage.text:'';
        cur={n,sec:secIdx,stemLines:[],options:[],optX:0,passage:pas,dir:curDir,ans:null,sol:'',state:'stem',x:l.x};
        const rest=qm[2].trim();if(rest)cur.stemLines.push(rest);
        expected=n+1;mode='q';continue;
      }
    }
    if(mode==='passage'){joinInto(pendPass.paras,l);continue}
    if(dirMode&&!cur){if(l.para||/^(Passage|Section)/i.test(t))dirMode=false;else{curDir+=' '+t;continue}}
    if(!cur){ if(l.para||!loose.length)loose.push(t);else loose[loose.length-1]+=' '+t; continue }
    /* inside a question */
    if((m=/^(?:Correct\s*)?(?:Ans(?:wer)?|Key)\s*[:\-–]\s*\(?([A-Da-d](?![A-Za-z])|\d+(?:\.\d+)?)\)?\.?\s*(.*)$/i.exec(t))){cur.ans=m[1];cur.sol=m[2]||'';cur.state='sol';continue}
    if((m=/^(?:Solution|Explanation|Sol\.?)\s*[:\-–]\s*(.*)$/i.exec(t))){cur.sol=m[1];cur.state='sol';continue}
    if(cur.state==='sol'){cur.sol+=' '+t;continue}
    /* options */
    const om=optRe.exec(t);
    if(om){
      const letter=(om[1]||om[2]).toUpperCase(),idx=letter.charCodeAt(0)-65;
      if(idx===cur.options.length&&(idx>0||/^[•·▪◦●‣*–-]?\s*\(/.test(t)||cur.options.length===0)){
        let rest=om[3];
        const parts=[];const ir=/\(([A-Da-d])\)\s*/g;let k,pos=[];
        while((k=ir.exec(rest)))pos.push({i:k.index,L:k[1].toUpperCase(),e:ir.lastIndex});
        if(pos.length&&pos[0].L===String.fromCharCode(66+idx)){
          cur.options.push(rest.slice(0,pos[0].i).trim());
          pos.forEach((p,q)=>{cur.options.push(rest.slice(p.e,q+1<pos.length?pos[q+1].i:undefined).trim())});
        }else cur.options.push(rest.trim());
        cur.state='opts';cur.optX=l.x;continue;
      }
    }
    if(cur.state==='opts'){
      const cont=(hasX&&l.x>margin+8)||(!l.para&&/^[a-z(“"'‘]/.test(t))||(!hasX&&!l.para);
      if(cont){cur.options[cur.options.length-1]+=' '+t;continue}
      if(l.para||true){ if(l.para||!loose.length)loose.push(t);else loose[loose.length-1]+=' '+t; continue }
    }
    /* stem */
    if(/^\(?\d{1,2}[.)]\s/.test(t)||l.para||!cur.stemLines.length)cur.stemLines.push(t);else cur.stemLines[cur.stemLines.length-1]+=' '+t;
  }
  closeQ();
  /* ----- build drafts ----- */
  const kw=(q)=>{
    const s=q.text.toLowerCase();
    if(q.type==='tita'){if(/odd (one|sentence)|out of context/.test(s))return['Odd Sentence Out',''];if(/sequence|order|arrange|jumble/.test(s))return['Para Jumbles','']}
    if(/(summar)/.test(s)&&q.options.length)return['Para Summary',''];
    if(/concluding sentence|completes? the|best completes|train of thought/.test(s))return['Para Completion',''];
    return null;
  };
  const rcSub=s=>{s=s.toLowerCase();
    if(/primary purpose|main (idea|point|purpose)|central (idea|argument|theme|thesis)|best captures|best summar|passage is (primarily )?(about|to)|author.s (primary )?(purpose|aim)/.test(s))return'Main Idea';
    if(/least likely|\bexcept\b|\bnot\b.*(true|mentioned|supported|consistent)|would not agree/.test(s))return'Negative / Except';
    if(/mirror|analogous|parallel|best illustrates|scenario|similar to the (reasoning|phenomenon)/.test(s))return'Mirror / Application';
    if(/infer|implies?|suggests?|most probably|can be concluded|follows from/.test(s))return'Inference';
    if(/tone|attitude|stance/.test(s))return'Tone & Attitude';
    if(/as used in|meaning of|closest in meaning/.test(s))return'Vocabulary in Context';
    return'';};
  const questions=qs.map(c=>{
    const type=c.options.length>=2?'mcq':'tita';
    let text=c.stemLines.join('\n').trim();
    const tg=topicGroups.filter(g=>c.n>=g.from&&c.n<=g.to).pop();
    const k=key[c.n];
    let ans=c.ans!=null?c.ans:(k?k.a:'');
    if(type==='mcq'){ans=/^[A-Da-d]$/.test(String(ans))?String(ans).toUpperCase():(/^[1-4]$/.test(String(ans))?String.fromCharCode(64+ +ans):'')}
    else ans=String(ans||'').replace(/\s+/g,'');
    const sol=((c.sol||'')||(k&&k.sol)||'').trim();
    const dir=c.dir&&(type==='tita'||!c.passage)?('Directions: '+c.dir.trim()+'\n\n'):'';
    const q={n:c.n,sec:Math.max(0,c.sec),type,topic:'',sub:'',difficulty:diffDoc,passage:c.passage||'',text:dir+text,options:type==='mcq'?c.options.slice(0,8):[],ans,solution:sol,marks:defMarks,neg:type==='mcq'?defNeg:0};
    const g=kw(q);
    let topic=tg?tg.name.replace(/\s+/g,' '):'';
    if(g){topic=(topic&&!/para|odd|sentence|jumble/i.test(topic))?topic:'Verbal Ability';q.sub=g[0]}
    if(c.passage||(/reading|comprehension/i.test(topic)&&!g)){topic=topic||'Reading Comprehension';q.sub=q.sub||rcSub(text)}
    q.topic=topic||sections[Math.max(0,c.sec)].name;
    return q;
  });
  /* warnings */
  const ns=questions.map(q=>q.n);const mx=ns.length?Math.max(...ns):0;
  for(let n=1;n<=mx;n++)if(!ns.includes(n))warnings.push('Question '+n+' was not found.');
  const seen={};ns.forEach(n=>{seen[n]=(seen[n]||0)+1});Object.keys(seen).forEach(n=>{if(seen[n]>1)warnings.push('Question '+n+' appears '+seen[n]+' times.')});
  questions.forEach(q=>{
    if(q.type==='mcq'&&q.options.length<4)warnings.push('Question '+q.n+' has only '+q.options.length+' options.');
    if(!q.ans)warnings.push('Question '+q.n+' has no answer yet.');
    if(!q.text)warnings.push('Question '+q.n+' has no question text.');
  });
  if(!questions.length)warnings.push('No questions were recognised. Try Parse with AI, or paste the text.');
  return {title:title.replace(/\s+/g,' ').slice(0,120),sections,questions,warnings,hadKey:keyIdx>=0||Object.keys(key).length>0};
}
function textToPages(text){
  const raw=String(text||'').replace(/\r/g,'').split('\f');
  return raw.map(pg=>{const out=[];let para=false;pg.split('\n').forEach(ln=>{const t=ln.trim();if(!t){para=true;return}out.push({t,x:0,para});para=false});return out});
}
if(typeof module!=='undefined')module.exports={parseExamPages,textToPages};

<script>
/* ===== PDF / text import: read, recognise, review, add ===== */
const IM={stage:'pick',busy:'',pct:0,draft:null,pages:null,fname:'',err:'',aiBusy:false};
const PDFJS_VER='3.11.174';
let pdfjsP=null;
function loadScript(src){return new Promise((res,rej)=>{const s=document.createElement('script');s.src=src;s.onload=res;s.onerror=()=>rej(new Error('Could not load '+src));document.head.appendChild(s)})}
async function loadPdfJs(){
  if(window.pdfjsLib)return window.pdfjsLib;
  if(!pdfjsP)pdfjsP=(async()=>{
    let base='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/'+PDFJS_VER+'/';
    if(window.desk&&window.desk.vendorUrl){try{const v=await window.desk.vendorUrl();if(v)base=v}catch(e){}}
    await loadScript(base+'pdf.min.js');
    window.pdfjsLib.GlobalWorkerOptions.workerSrc=base+'pdf.worker.min.js';
    return window.pdfjsLib;
  })().catch(e=>{pdfjsP=null;throw new Error('The PDF reader could not be loaded (it needs an internet connection the first time). '+e.message)});
  return pdfjsP;
}
function groupLines(items){
  /* items: [{s,x,y,w,h}] with y increasing downward; returns [{t,x,y,para}] */
  items.sort((a,b)=>a.y-b.y||a.x-b.x);
  const rows=[];
  items.forEach(it=>{const r=rows.find(r=>Math.abs(r.y-it.y)<=Math.max(2.5,it.h*.35));if(r){r.it.push(it)}else rows.push({y:it.y,it:[it]})});
  rows.sort((a,b)=>a.y-b.y);
  const lines=rows.map(r=>{r.it.sort((a,b)=>a.x-b.x);let t='',end=null;
    r.it.forEach(it=>{if(end!=null&&it.x-end>Math.max(1.2,it.h*.12)&&!/\s$/.test(t)&&!/^\s/.test(it.s))t+=' ';t+=it.s;end=it.x+it.w});
    return {t:t.replace(/\s+/g,' ').trim(),x:r.it[0].x,y:r.y}}).filter(l=>l.t);
  const gaps=[];for(let i=1;i<lines.length;i++)gaps.push(lines[i].y-lines[i-1].y);
  gaps.sort((a,b)=>a-b);const med=gaps.length?gaps[Math.floor(gaps.length/2)]:12;
  lines.forEach((l,i)=>{l.para=i>0&&(l.y-lines[i-1].y)>med*1.45});
  return lines;
}
async function pdfToPages(file,progress){
  const lib=await loadPdfJs();
  const doc=await lib.getDocument({data:new Uint8Array(await file.arrayBuffer())}).promise;
  const pages=[];let ocrUsed=0,skipped=0;
  for(let i=1;i<=doc.numPages;i++){
    progress('Reading page '+i+' of '+doc.numPages,(i-1)/doc.numPages);
    const page=await doc.getPage(i);
    const tc=await page.getTextContent();
    const items=tc.items.filter(it=>it.str&&it.str.trim()).map(it=>({s:it.str,x:it.transform[4],y:-it.transform[5],w:it.width||0,h:Math.abs(it.transform[3])||10}));
    let lines=groupLines(items);
    if(lines.reduce((n,l)=>n+l.t.length,0)<25){
      /* scanned page: render and OCR (desktop app only) */
      if(window.desk&&window.desk.ocr){
        progress('Reading page '+i+' of '+doc.numPages+' with OCR (this takes a few seconds)',(i-1)/doc.numPages);
        const vp=page.getViewport({scale:2.2}),cv=document.createElement('canvas');cv.width=vp.width;cv.height=vp.height;
        await page.render({canvasContext:cv.getContext('2d'),viewport:vp}).promise;
        const r=await window.desk.ocr(cv.toDataURL('image/png'));
        const its=(r.lines||[]).map(l=>({s:l.t,x:l.x,y:l.y,w:l.t.length*7,h:l.h||14}));
        lines=groupLines(its);ocrUsed++;
      }else skipped++;
    }
    pages.push(lines);
  }
  return {pages,ocrUsed,skipped,n:doc.numPages};
}

async function importFiles(files){
  const f=files[0];if(!f)return;
  IM.err='';IM.fname=f.name;
  try{
    if(/\.pdf$/i.test(f.name)||f.type==='application/pdf'){
      IM.stage='pick';IM.busy='Opening PDF…';IM.pct=0;go('import');
      const r=await pdfToPages(f,(m,p)=>{IM.busy=m;IM.pct=p;if(V.view==='import'&&IM.stage==='pick')paintProg()});
      IM.pages=r.pages;
      const d=parseExamPages(r.pages);
      let note='';
      if(r.skipped)note=r.skipped+' page'+(r.skipped>1?'s look':' looks')+' like a scan, and OCR is only available in the Windows app. Open this PDF there, or paste the text instead.';
      if(r.ocrUsed)note='OCR was used on '+r.ocrUsed+' page'+(r.ocrUsed>1?'s':'')+'. Scanned text can contain small mistakes, so check the questions below.';
      if(!d.questions.length&&r.skipped)throw new Error(note);
      return startReview(d,f.name.replace(/\.pdf$/i,''),note);
    }
    const txt=await f.text();
    return importText(txt,f.name.replace(/\.\w+$/,''));
  }catch(e){IM.stage='pick';IM.busy='';IM.err=e.message||String(e);go('import')}
}

function checkDraft(d){
  const w=[];const ns=d.questions.map(q=>q.n);
  d.questions.forEach(q=>{
    if(q.type==='mcq'&&(!q.options||q.options.length<2))w.push('Question '+q.n+' is marked multiple choice but has fewer than 2 options.');
    if(!q.ans)w.push('Question '+q.n+' has no correct answer yet.');
    else if(q.type==='mcq'&&(q.ans.charCodeAt(0)-65)>=q.options.length)w.push('Question '+q.n+': answer '+q.ans+' does not match an option.');
    if(!String(q.text).trim())w.push('Question '+q.n+' has no text.');
  });
  const mx=ns.length?Math.max(...ns):0;const miss=[];for(let n=1;n<=mx;n++)if(!ns.includes(n))miss.push(n);
  if(miss.length)w.push('Question number'+(miss.length>1?'s':'')+' '+miss.join(', ')+' not found in the file.');
  return w;
}
function warnHtml(w){return w.length?`<div class="warnbox"><b>${w.length} thing${w.length>1?'s':''} to check</b><ul>${w.slice(0,12).map(x=>`<li>${esc(x)}</li>`).join('')}${w.length>12?`<li>and ${w.length-12} more</li>`:''}</ul></div>`:'<div class="msg ok">Everything looks complete.</div>'}
function draftToRaw(d){
  const secs=d.sections.map(s=>({name:s.name||'Section',minutes:+s.minutes||40,questions:[]}));
  d.questions.forEach(q=>{
    const t=secs[Math.min(q.sec,secs.length-1)];
    const o={type:q.type,question:q.text,passage:q.passage||'',topic:q.topic||'General',subtopic:q.sub||'',difficulty:q.difficulty,marks:+q.marks||3,negative:+q.neg||0,solution:q.solution||''};
    if(q.type==='mcq'){o.options=q.options;o.answer=q.ans}else o.answer=String(q.ans||'').split(/\s*\/\s*|\s*,\s*/).filter(Boolean);
    t.questions.push(o);
  });
  return {title:d.title,sections:secs.filter(s=>s.questions.length)};
}
function applyKeyText(txt){
  const d=IM.draft;let n=0;
  const re=/(?:^|[\s,;(])(?:Q\.?\s*)?(\d{1,3})\s*[-–:=.)]\s*\(?([A-Da-d](?![A-Za-z\d])|\d{1,6}(?:\.\d+)?(?:\s*\/\s*\d+(?:\.\d+)?)*)\)?(?=[\s,;.)]|$)/g;
  let m;while((m=re.exec(txt))){const q=d.questions.find(x=>x.n===+m[1]);if(!q)continue;
    let a=m[2].replace(/\s+/g,'');
    if(q.type==='mcq'){a=/^[A-Da-d]$/.test(a)?a.toUpperCase():(/^[1-4]$/.test(a)?String.fromCharCode(64+ +a):'');}
    if(a){q.ans=a;n++}}
  return n;
}
async function aiRead(){
  const d=IM.draft;IM.aiBusy=true;IM.err='';renderReview();
  try{
    const flat=(IM.pages||[]).map(pg=>pg.map(l=>l.t).join('\n')).join('\n\n');
    const text=flat||d.questions.map(q=>(q.passage?q.passage+'\n':'')+q.n+'. '+q.text+'\n'+(q.options||[]).map((o,i)=>'('+String.fromCharCode(65+i)+') '+o).join('\n')).join('\n\n');
    const chunks=[];let ci=0;while(ci<text.length){let e=Math.min(text.length,ci+11000);if(e<text.length){const cut=text.lastIndexOf('\n',e);if(cut>ci+6000)e=cut}chunks.push(text.slice(ci,e));ci=e}
    const keyPos=text.search(/answer\s*key/i);const keyEx=keyPos>0?text.slice(keyPos,keyPos+7000):'';
    const out=[];
    for(let c=0;c<chunks.length;c++){
      const pr='Extract every question that STARTS in the text below into JSON. Output only a JSON object {"questions":[...]} with no prose. Each question: {"n":number,"type":"mcq"|"tita","passage":"full passage text if the question belongs to one, else empty","question":"stem","options":["text without A) labels"],"answer":"A-D letter or the typed answer","topic":"","subtopic":"","difficulty":"easy|medium|hard","solution":""}. Use the answer key excerpt to fill answers and solutions. Do not invent questions.\n\nTEXT (part '+(c+1)+' of '+chunks.length+'):\n'+chunks[c]+(keyEx&&c<chunks.length-1?'\n\nANSWER KEY EXCERPT:\n'+keyEx:'');
      let r=await aiAsk(pr);r=String(r).replace(/^```(?:json)?/i,'').replace(/```\s*$/,'').trim();
      const a=r.indexOf('{'),b=r.lastIndexOf('}');const j=JSON.parse(r.slice(a,b+1));
      (j.questions||[]).forEach(q=>out.push(q));
    }
    if(!out.length)throw new Error('The AI did not return any questions.');
    const seen=new Set();const qs=[];
    out.sort((x,y)=>x.n-y.n).forEach(q=>{if(seen.has(q.n))return;seen.add(q.n);
      const opts=Array.isArray(q.options)?q.options.map(o=>String(o).replace(/^\s*\(?[A-Ha-h][\)\.:]\s+/,'')):[];
      const type=opts.length>=2?'mcq':'tita';let ans=String(q.answer==null?'':q.answer).replace(/[()\s]/g,'');
      if(type==='mcq'&&!/^[A-Da-d]$/.test(ans))ans=/^[1-4]$/.test(ans)?String.fromCharCode(64+ +ans):'';
      if(type==='mcq')ans=ans.toUpperCase();
      const old=d.questions.find(x=>x.n===q.n);
      qs.push({n:+q.n||qs.length+1,sec:old?old.sec:0,type,topic:q.topic||(old&&old.topic)||'',sub:q.subtopic||(old&&old.sub)||'',difficulty:DIFFS.includes(q.difficulty)?q.difficulty:(old?old.difficulty:'medium'),passage:q.passage||'',text:String(q.question||''),options:type==='mcq'?opts:[],ans,solution:q.solution||'',marks:old?old.marks:3,neg:type==='mcq'?(old?old.neg||1:1):0});
    });
    d.questions=qs;d.hadKey=true;IM.note='The AI re-read the paper. Please check the answers.';
  }catch(e){IM.err='AI reading failed: '+(e.message||e)}
  IM.aiBusy=false;renderReview();
}

<script>

      const q=P&&P.questions[x.n-1],key=(q&&q.srcKey)||(a.paperId+':'+x.id);

      const got=typeof x.got==='number'?x.got:(x.status==='correct'?x.marks:(x.status==='wrong'?-(x.neg||0):0));
      h.ev.push({d:a.date,st:x.status,got,marks:x.marks||0,time:a.noTime?null:x.time});
    });
  });

}
function poolMap(){const m={};qPool().forEach(it=>{m[it.key]=it});return m}
function mistakeItems(){
  const H=qHistory(),P=poolMap(),now=Date.now(),out=[];
  Object.values(H).forEach(h=>{
    const wrongs=h.ev.filter(e=>e.st!=='correct').length;if(!wrongs)return;
    let streak=0;for(let i=h.ev.length-1;i>=0&&h.ev[i].st==='correct';i--)streak++;
    const last=h.ev[h.ev.length-1],mastered=streak>=NEED_RIGHT,dueAt=last.d+REVIEW_DAYS*DAY;
    out.push(Object.assign({},h,{wrongs,streak,last,mastered,dueAt,due:!mastered&&dueAt<=now,pool:P[h.key]||null}));
  });
  return out.sort((a,b)=>a.dueAt-b.dueAt);
}
function dueCount(){try{return mistakeItems().filter(m=>m.due&&m.pool).length}catch(e){return 0}}
function dueLabel(m){
  if(m.mastered)return 'Mastered';
  const d=m.dueAt-Date.now();if(d<=0)return 'Due now';
  const n=Math.ceil(d/DAY);return 'Review in '+n+' day'+(n>1?'s':'');
}
function startDerivedFrom(items,title,secName,perq){
  if(!items.length)return;
  const d=buildDerived(items.map(it=>({q:it.q,key:it.key})),title,Math.max(3,Math.round(items.length*(perq||2))),secName);
  V.paperId=d.id;V.mode='cat';V.scope='all';V.tmv=null;V.untimed=false;V.instant=false;go('instr');
}

function topicStats(){
  const S={},open={};mistakeItems().forEach(m=>{if(!m.mastered)open[m.topic]=(open[m.topic]||0)+1});
  [...store.attempts].sort((a,b)=>a.date-b.date).forEach(a=>a.qs.forEach(x=>{
    if(x.status==='unseen')return;const t=x.topic||'General';
    const s=S[t]||(S[t]={topic:t,n:0,c:0,w:0,s:0,lost:0,time:0,tn:0,ev:[],subs:{},open:open[t]||0});
    const got=typeof x.got==='number'?x.got:(x.status==='correct'?x.marks:(x.status==='wrong'?-(x.neg||0):0));
    s.n++;if(x.status==='correct')s.c++;else if(x.status==='wrong')s.w++;else s.s++;
    s.lost+=Math.max(0,(x.marks||0)-got);s.ev.push(x.status==='correct');
    if(!a.noTime&&x.time){s.time+=x.time;s.tn++}
    const k=x.sub||'(general)',u=s.subs[k]||(s.subs[k]={n:0,c:0});u.n++;if(x.status==='correct')u.c++;
  }));
  return Object.values(S).map(s=>{const r=s.ev.slice(-10);s.acc=pct(s.c,s.n);s.recent=r.length?pct(r.filter(Boolean).length,r.length):null;s.avgT=s.tn?Math.round(s.time/s.tn):null;return s}).sort((a,b)=>b.lost-a.lost||a.acc-b.acc);
}
function renderWeak(){

  const maxLost=rank.length?rank[0].lost:1;
  const card=(s,i)=>{
    const subs=Object.entries(s.subs).filter(([k,u])=>k!=='(general)'&&u.c<u.n).sort((a,b)=>(a[1].c/a[1].n)-(b[1].c/b[1].n)||b[1].n-a[1].n).slice(0,3);

    return `<div class="paper" style="grid-template-columns:auto minmax(0,1fr) auto;align-items:start"><label style="display:flex;gap:10px;align-items:flex-start;padding-top:2px"><input type="checkbox" data-wk="${esc(s.topic)}" ${wk.sel.has(s.topic)?'checked':''} ${avail[s.topic]?'':'disabled'} aria-label="Include ${esc(s.topic)}"><span class="num" style="font-weight:600;color:var(--ink2)">#${i+1}</span></label>

     <label class="field" style="max-width:170px;min-width:130px"><span class="sub">Minutes per question</span><input id="wkperq" type="number" min="0.5" max="10" step="0.5" value="${wk.perq}"></label>

   ${thin.length?`<div class="panel"><h3>No weakness showing yet</h3><div class="chips">${thin.map(s=>`<span class="chip">${esc(s.topic)} · ${s.n}Q${s.lost===0?' · no marks lost':' · too few questions'}</span>`).join('')}</div></div>`:''}</div>`
  :`<div class="panel"><p class="sub">${st.length?'No topic has enough data yet. A topic needs at least 2 attempted questions with marks lost before it is ranked.':'Finish an attempt, or log a past one, and your weakest topics are ranked here.'}</p></div>`}
  ${footerHtml()}</div>`;
}
function allocate(ts,count){
  const al={};ts.forEach(x=>al[x.t]=0);let left=count;
  while(left>0){
    const op=ts.filter(x=>al[x.t]<x.avail);if(!op.length)break;
    const tw=op.reduce((s,x)=>s+x.w,0);let given=0;
    op.sort((a,b)=>b.w-a.w).forEach(x=>{let g=Math.max(1,Math.round(left*x.w/tw));g=Math.min(g,x.avail-al[x.t],left-given);if(g>0){al[x.t]+=g;given+=g}});
    if(!given)break;left-=given;
  }

}
function pickForTopic(topic,k,M){

function buildWeak(topics,count,perq,title,secName){

  const al=allocate(ts,Math.max(1,count));let items=[];
  ts.forEach(x=>{items=items.concat(pickForTopic(x.t,al[x.t]||0,M))});

}

});

}
function topicQuestionsHtml(A,topic,sub){
  const match=x=>x.topic===topic&&(!sub||x.sub===sub);
  const keyOf=(B,x)=>{const PB=attPaper(B),q=PB&&PB.questions[x.n-1];return (q&&q.srcKey)||(B.paperId+':'+x.id)};
  const seen=new Set(),P=attPaper(A);
  const mine=A.qs.filter(match);mine.forEach(x=>seen.add(keyOf(A,x)));
  let h='<div class="tq">';
  h+=mine.length?paperGroup('This paper · '+A.title,({full:'Full syllabus',sectional:'Sectional',topic:'Topic-wise'}[attCat(A)]||''),mine.map(x=>({B:A,PB:P,x})),true):'<div class="pg"><div class="pgh cur"><b>This paper · '+esc(A.title)+'</b><span class="sub">no questions from this topic</span></div></div>';
  const by=new Map();
  [...store.attempts].filter(B=>B.id!==A.id).sort((a,b)=>b.date-a.date).forEach(B=>{
    const PB=attPaper(B);
    B.qs.forEach(x=>{if(!match(x))return;const k=keyOf(B,x);if(seen.has(k))return;seen.add(k);
      if(!by.has(B.id))by.set(B.id,{B,items:[]});by.get(B.id).items.push({B,PB,x})});
  });

<script>
'use strict';
/* ===== solutions shown as numbered steps with typeset maths ===== */
function mathSet(h){
  h=h.replace(/sqrt\(([^()]+)\)/gi,'√($1)').replace(/(\d)\s*sqrt\s*(\d+)/gi,'$1√$2');
  h=h.replace(/\^\(([^()]+)\)/g,'<sup>$1</sup>').replace(/\^(-|&minus;|−)?([A-Za-z0-9.]+)/g,(m,a,b)=>'<sup>'+(a?'−':'')+b+'</sup>');
  h=h.replace(/&lt;=/g,'≤').replace(/&gt;=/g,'≥').replace(/!=/g,'≠').replace(/-&gt;/g,'→').replace(/=&gt;/g,'⇒');
  h=h.replace(/(^|[\d)\s])\*(?=[\s\d(])/g,'$1×');
  h=h.replace(/(\s)-(?=\s)/g,'$1−').replace(/(=\s*)-(?=\d)/g,'$1−');
  h=h.replace(/[\u2070\u00B9\u00B2\u00B3\u2074-\u2079\u207A\u207B\u207F]+/g,m=>'<sup>'+[...m].map(c=>'0123456789+\u2212n'['\u2070\u00B9\u00B2\u00B3\u2074\u2075\u2076\u2077\u2078\u2079\u207A\u207B\u207F'.indexOf(c)]).join('')+'</sup>');
  return h;
}
const SUPCH='⁰¹²³⁴⁵⁶⁷⁸⁹⁺⁻ⁿ';
const MATH_RUN=/(?:[A-Za-z0-9₹.,%()√\u0002\u0003²³¹⁰-₟]+(?:\s*(?:=|[+\-−×÷*\/^<>≤≥≠≡≈])\s*[A-Za-z0-9₹.,%()√\u0002\u0003²³¹⁰-₟]+)+)/g;
function fracPlace(t,store){
  const isAl=c=>/[A-Za-z0-9.]/.test(c),isSup=c=>SUPCH.includes(c),plain=/^[A-Za-z]+$/;
  const unwrap=x=>{if(x[0]!=='('||x[x.length-1]!==')')return x;let d=0;for(let j=0;j<x.length;j++){if(x[j]==='(')d++;else if(x[j]===')'){d--;if(!d&&j<x.length-1)return x}}return x.slice(1,-1)};
  const sub=x=>stepInner(x,store);
  let s=t,i=0;
  while((i=s.indexOf('/',i))>=0){
    let a=i;
    while(a>0){const c=s[a-1];
      if(c===')'){let d=0,j=a-1;for(;j>=0;j--){if(s[j]===')')d++;else if(s[j]==='('){d--;if(!d)break}}if(j<0)break;a=j}
      else if(c==='\u0003'){const k=s.lastIndexOf('\u0002',a-1);if(k<0)break;a=k}
      else if(isAl(c)||isSup(c)||c==='^')a--;
      else break}
    while(a<i&&s[a]==='.')a++;
    let e=i+1;
    if(s[e]==='('){let d=0,j=e;for(;j<s.length;j++){if(s[j]==='(')d++;else if(s[j]===')'){d--;if(!d)break}}if(j>=s.length){i++;continue}e=j+1}
    else if(s[e]==='\u0002'){const k=s.indexOf('\u0003',e);if(k<0){i++;continue}e=k+1}
    else{while(e<s.length&&isAl(s[e]))e++;while(e>i+1&&s[e-1]==='.')e--}
    while(e<s.length&&isSup(s[e]))e++;
    if(s[e]==='^'&&/[A-Za-z0-9]/.test(s[e+1]||'')){e+=2;while(e<s.length&&/[A-Za-z0-9]/.test(s[e]))e++}
    const L=s.slice(a,i),R=s.slice(i+1,e);
    const bad=!L||!R||s[e]==='/'||s[a-1]==='/'||(plain.test(L)&&plain.test(R))||(plain.test(L)&&L.length>1)||(plain.test(R)&&R.length>1)||/^\d+[A-Za-z]{2,}/.test(R)||(!/\d|[()]/.test(L+R));
    if(bad){i++;continue}
    store.push('<span class="fr"><i>'+sub(unwrap(L))+'</i><i>'+sub(unwrap(R))+'</i></span>');
    const ph='\u0002'+(store.length-1)+'\u0003';
    s=s.slice(0,a)+ph+s.slice(e);i=a+ph.length;
  }
  return s;
}
function stepInner(x,store){return mathSet(esc(fracPlace(x,store)))}
function stepHtml(t){
  const store=[];const T=fracPlace(String(t).replace(/\b([A-Za-z])_([A-Za-z0-9]+)\b/g,(m,x,y)=>{store.push(esc(x)+'<sub>'+esc(y)+'</sub>');return '\u0002'+(store.length-1)+'\u0003'}),store);
  let out='',last=0,m;MATH_RUN.lastIndex=0;
  while((m=MATH_RUN.exec(T))){
    const seg=m[0];
    if(!(/\d/.test(seg)||seg.includes('='))||seg.length<3)continue;
    out+=mathSet(esc(T.slice(last,m.index)))+'<span class="m">'+mathSet(esc(seg))+'</span>';last=m.index+seg.length;
  }
  out+=mathSet(esc(T.slice(last)));
  let n=0;while(/\u0002\d+\u0003/.test(out)&&n++<30)out=out.replace(/\u0002(\d+)\u0003/g,(_,i)=>store[+i]);
  return out;
}
function solSteps(text){
  let t=String(text||'').replace(/\r/g,'').replace(/\*\*|__|`/g,'').replace(/^[ \t]*(?:#+\s*|[-*\u2022]\s+)/gm,'').replace(/\b(i\.e\.|e\.g\.|Rs\.)/g,m=>m.replace(/\./g,'\u0001'));
  const steps=[];
  t.split(/\n+/).forEach(line=>{
    line=line.trim().replace(/^(step\s*\d+\s*[:.)-]\s*|\d+[.)]\s+)/i,'');if(!line)return;
    line.split(/(?<=[.;])\s+(?=[A-Z0-9(₹√])/).forEach(p=>{p=p.replace(/[.;]\s*$/,'').replace(/\u0001/g,'.').trim();if(p)steps.push(p)});
  });
  const merged=[];steps.forEach(p=>{const pv=merged[merged.length-1];if(pv&&/^traps?\b/i.test(pv))merged[merged.length-1]=pv+'; '+p;else merged.push(p)});
  return merged;
}
function solBlock(text,style,title){
  const st=solSteps(text);if(!st.length)return '';
  return `<div class="sol math"${style?` style="${style}"`:''}><b>${esc(title||'Solution')}</b>${st.map((p,i)=>{
    const words=(p.match(/[A-Za-z]{3,}/g)||[]).length,eq=p.includes('=')&&words<=3,fin=/^(hence|therefore|thus|so|answer)\b/i.test(p);
    return `<div class="st${eq?' eq':''}${fin?' fin':''}"><span class="sn">${i+1}</span><div class="sb">${stepHtml(p)}</div></div>`}).join('')}</div>`;
}
</script>

<script>
'use strict';
/* ===== ask AI about one question: explain, shortcut, why wrong, or any question ===== */
const QAI_LABEL={explain:'Step-by-step',trick:'Shortcut / trick',why:'Why I went wrong',ask:'Your question'};
function qaiOut(list){
  return (list||[]).slice(-6).reverse().map(r=>{
    const body=(r.m==='explain'||r.m==='trick')?solBlock(r.text,'',QAI_LABEL[r.m]):`<div class="sol math"><b>${esc(QAI_LABEL[r.m])}${r.q?': '+esc(r.q):''}</b>${md(r.text)}</div>`;
    return `<div>${body}<div class="qm">${fmtDate(r.at)} · ${esc(r.by||'AI')} <button class="btn sm" data-act="qaidel" data-at="${r.at}" title="Remove this AI result">Remove</button></div></div>`}).join('');
}
function qaiBlock(A,x){
  return `<div class="qai" data-aid="${esc(A.id)}" data-qid="${esc(x.id)}"><div class="qrow"><span class="ql">Ask AI</span>
   <button class="btn sm" data-act="qai" data-m="explain">Explain step by step</button>
   <button class="btn sm" data-act="qai" data-m="trick">Shortcut / trick</button>
   <button class="btn sm" data-act="qai" data-m="why">Why did I go wrong?</button></div>
   <div class="qrow"><input placeholder="Or ask anything about this question…" aria-label="Ask AI about this question"><button class="btn sm pri" data-act="qai" data-m="ask">Ask</button></div>
   <div class="qo">${qaiOut((A.qai||{})[x.id])}</div></div>`;
}
function qaiPrompt(A,x,m,custom){
  const P=attPaper(A),q=P&&P.questions[x.n-1]&&P.questions[x.n-1].id===x.id?P.questions[x.n-1]:null;
  const L=['You are a CAT (Common Admission Test, India) coach. Be accurate and concise. Write maths in plain text using ^ for powers, / for division, * for multiplication. No markdown headings, no bold.',''];
  L.push('Subject area: '+x.secName+' · Topic: '+x.topic+(x.sub?' › '+x.sub:'')+' · Difficulty: '+x.difficulty);
  if(q&&q.passage)L.push('Passage / data set:\n'+String(q.passage).slice(0,1800));
  L.push('Question:\n'+(q?q.text:x.topic));
  if(q&&q.type==='mcq')L.push('Options:\n'+q.options.map((o,k)=>String.fromCharCode(65+k)+'. '+o).join('\n'));
  if(q)L.push('Correct answer: '+correctText(q));
  L.push('Student result: '+(x.status==='skipped'||x.status==='unseen'?'left blank':x.status)+(x.given!=null?', answered '+givenText(0,x,q):'')+', spent '+fmtT(x.time)+' against '+fmtT(idealOf(A,x))+' available.');
  if(q&&q.solution)L.push('Reference solution (may be terse):\n'+String(q.solution).slice(0,1500));
  L.push('');
  if(m==='explain')L.push('Task: solve this step by step. One short step per line, each line a sentence or one equation. End with a line starting "Hence" that states the answer. Under 180 words.');
  else if(m==='trick')L.push('Task: give the fastest legitimate CAT shortcut for this exact question (mental maths, option elimination, special cases, pattern, symmetry). Give it as short numbered lines, then one line starting "Use it when" naming the pattern to recognise, and one line starting "Trap" naming the usual mistake. Aim to be solvable in under 60 seconds. Under 160 words.');
  else if(m==='why')L.push('Task: based on the student result above, say in 3 to 5 short lines the most likely reason they missed it or were slow (concept gap, misread, calculation, time sink, wrong approach), and one concrete habit to fix it. Do not invent facts beyond the data.');
  else L.push('Student question: '+custom+'\nAnswer it directly and briefly, in the context of this question.');
  return L.join('\n');
}
acts.qaidel=t=>{
  const box=t.closest('.qai');if(!box)return;
  const A=store.attempts.find(a=>a.id===box.dataset.aid);if(!A||!A.qai)return;
  const id=box.dataset.qid;A.qai[id]=(A.qai[id]||[]).filter(r=>String(r.at)!==t.dataset.at);
  if(!A.qai[id].length)delete A.qai[id];
  store.save(A);box.querySelector('.qo').innerHTML=qaiOut(A.qai[id]);toast('AI result removed');
};
acts.qai=async t=>{
  const box=t.closest('.qai');if(!box)return;
  const A=store.attempts.find(a=>a.id===box.dataset.aid);if(!A)return;
  const x=A.qs.find(q=>q.id===box.dataset.qid);if(!x)return;
  const m=t.dataset.m,inp=box.querySelector('input');let custom='';
  if(m==='ask'){custom=inp.value.trim();if(!custom){toast('Type your question first');return}}
  const out=box.querySelector('.qo'),btns=box.querySelectorAll('button');
  btns.forEach(b=>b.disabled=true);
  const hold=document.createElement('div');hold.className='think';hold.textContent='Thinking…';out.prepend(hold);
  try{
    const text=await aiAsk(qaiPrompt(A,x,m,custom));
    if(!text||!String(text).trim())throw new Error('The AI returned an empty answer.');
    A.qai=A.qai||{};(A.qai[x.id]=A.qai[x.id]||[]).push({m,q:custom,text:String(text),at:Date.now(),by:DESK?(AI_LABEL[AIS.provider]||'AI')+(AIS.model?' · '+AIS.model:''):'Claude'});
    store.save(A);if(m==='ask')inp.value='';
    out.innerHTML=qaiOut(A.qai[x.id]);
  }catch(e){
    hold.className='msg err';hold.textContent=(e&&e.message)||String(e);
  }
  btns.forEach(b=>b.disabled=false);
};
document.addEventListener('click',e=>{const t=e.target.closest&&e.target.closest('#zoomov [data-act="qai"],#zoomov [data-act="qaidel"]');if(t)acts[t.dataset.act](t)});
document.addEventListener('keydown',e=>{
  if(e.key==='Enter'&&e.target.matches&&e.target.matches('.qai input')){e.preventDefault();const b=e.target.closest('.qai').querySelector('[data-m="ask"]');if(b&&!b.disabled)acts.qai(b)}
});
</script>

<script>
'use strict';
/* ===== Cloud sync with Supabase: papers and attempts, for the Android and Windows apps ===== */
const SB_SQL=`create table if not exists public.docs (
  user_id uuid not null default auth.uid() references auth.users(id) on delete cascade,
  id text not null,
  kind text not null default '',
  data jsonb,
  upd bigint not null default 0,
  deleted boolean not null default false,
  srv bigint not null default 0,
  primary key (user_id, id)
);
create index if not exists docs_srv_idx on public.docs (user_id, srv);
alter table public.docs enable row level security;
drop policy if exists "own rows" on public.docs;
create policy "own rows" on public.docs for all to authenticated
  using (auth.uid() = user_id) with check (auth.uid() = user_id);
create or replace function public.docs_guard() returns trigger language plpgsql as $$
begin
  if tg_op = 'UPDATE' then
    if new.upd < old.upd then return null; end if;
  end if;
  new.srv := (extract(epoch from clock_timestamp()) * 1000)::bigint;
  return new;
end $$;
drop trigger if exists docs_guard_trg on public.docs;
create trigger docs_guard_trg before insert or update on public.docs
  for each row execute function public.docs_guard();`;
const SY=Object.assign({url:'',key:'',email:'',uid:'',refresh:'',srv:0,last:0,msg:''},LS.get('cmd.sb')||{});SY.access='';SY.exp=0;
let SY_TOMB=LS.get('cmd.tomb')||{},SY_DIRTY=LS.get('cmd.dirty')||{},SY_APPLYING=false,SY_BUSY=false,SYERR='',SYWORK='',syT=null;
const SYF={};
const syPersist=()=>LS.set('cmd.sb',{url:SY.url,key:SY.key,email:SY.email,uid:SY.uid,refresh:SY.refresh,srv:SY.srv,last:SY.last,msg:SY.msg});
const updOf=d=>d.upd||d.created||d.date||0;
const syMarkDirty=id=>{SY_DIRTY[id]=1;LS.set('cmd.dirty',SY_DIRTY)};
function sySchedule(){clearTimeout(syT);if(SY.refresh)syT=setTimeout(()=>syncNow(true),12000)}
{const _s=store.save.bind(store),_r=store.remove.bind(store);
 store.save=function(d){if(!SY_APPLYING){d.upd=Date.now();syMarkDirty(d.id)}_s(d);sySchedule()};
 store.remove=function(d){const t=Date.now();SY_TOMB[d.id]=t;LS.set('cmd.tomb',SY_TOMB);syMarkDirty(d.id);_r(d);sySchedule()};}
async function syHttp(url,o){
  o=o||{};
  if(window.desk&&window.desk.http){const r=await window.desk.http({url,method:o.method||'GET',headers:o.headers||{},body:o.body==null?null:String(o.body)});return {status:r.status,text:async()=>r.text}}
  try{return await fetch(url,o)}catch(e){throw new Error('Could not reach the server. Check the internet connection and the Project URL.')}
}
async function syJson(url,o){const r=await syHttp(url,o);let t='',j=null;try{t=await r.text();j=t?JSON.parse(t):null}catch(e){}return {status:r.status,j,t}}
const syBase=()=>String(SY.url).trim().replace(/\/(rest|auth)\/v1.*$/,'').replace(/\/+$/,'');
function syErrMsg(r){const j=r.j||{};return j.error_description||j.msg||j.message||j.hint||(typeof j.error==='string'?j.error:'')||(r.t?String(r.t).slice(0,200):'')||('HTTP '+r.status)}
function syAuth(path,body){return syJson(syBase()+'/auth/v1/'+path,{method:'POST',headers:{'Content-Type':'application/json',apikey:SY.key},body:JSON.stringify(body)})}
function syTakeSession(j){SY.access=j.access_token;SY.exp=Date.now()+(j.expires_in||3600)*1000;if(j.refresh_token)SY.refresh=j.refresh_token;if(j.user&&j.user.id)SY.uid=j.user.id}
async function syToken(){
  if(SY.access&&Date.now()<SY.exp-60000)return SY.access;
  const r=await syAuth('token?grant_type=refresh_token',{refresh_token:SY.refresh});
  if(r.status>=400||!r.j||!r.j.access_token){
    if(r.status===400||r.status===401||r.status===403){SY.refresh='';syPersist();throw new Error('You were signed out by the server. Open Cloud sync and sign in again.')}
    throw new Error(syErrMsg(r));
  }
  syTakeSession(r.j);syPersist();return SY.access;
}
async function syRest(tok,path,o){
  o=o||{};o.headers=Object.assign({apikey:SY.key,Authorization:'Bearer '+tok},o.headers||{});
  const r=await syJson(syBase()+'/rest/v1/'+path,o);
  if(r.status>=400){let m=syErrMsg(r);if(/PGRST205|schema cache|relation .*docs/i.test(m+JSON.stringify(r.j||'')))m='The "docs" table is missing. Run the SQL from the setup steps in the Supabase SQL Editor.';throw new Error('Supabase: '+m)}
  return r;
}
async function syncNow(silent){
  if(SY_BUSY)return;
  if(!SY.refresh){if(!silent)toast('Sign in to Cloud sync first');return}
  SY_BUSY=true;SY.msg='Syncing…';syPaint();
  try{
    const tok=await syToken();
    if(!SY.last){[...store.papers,...store.attempts].forEach(d=>{SY_DIRTY[d.id]=1});LS.set('cmd.dirty',SY_DIRTY)}
    const from=Math.max(0,(SY.srv||0)-5000),remoteUpd={};let off=0,maxSrv=SY.srv||0,down=0,changed=false;
    for(;;){
      const r=await syRest(tok,'docs?select=id,kind,data,upd,deleted,srv&srv=gt.'+from+'&order=srv.asc&limit=40&offset='+off);
      const part=Array.isArray(r.j)?r.j:[];
      SY_APPLYING=true;
      for(const row of part){
        maxSrv=Math.max(maxSrv,row.srv||0);remoteUpd[row.id]=row.upd;
        const ip=store.papers.findIndex(x=>x.id===row.id),ia=store.attempts.findIndex(x=>x.id===row.id);
        const list=ip>=0?store.papers:ia>=0?store.attempts:null,idx=ip>=0?ip:ia,loc=list?list[idx]:null;
        if(row.deleted){
          if(loc&&updOf(loc)<=row.upd){list.splice(idx,1);changed=true;down++;delete SY_DIRTY[row.id]}
          SY_TOMB[row.id]=Math.max(SY_TOMB[row.id]||0,row.upd);
        }else if(row.data){
          const t=SY_TOMB[row.id];if(t&&t>=row.upd)continue;
          if(!loc||row.upd>updOf(loc)){
            const d=Object.assign({},row.data,{upd:row.upd});
            if(loc)list[idx]=d;else (d.kind==='paper'?store.papers:store.attempts).unshift(d);
            changed=true;down++;delete SY_DIRTY[row.id];
          }
        }
      }
      SY_APPLYING=false;
      if(part.length<40)break;off+=40;
    }
    if(changed){store.papers.sort((a,b)=>(b.created||0)-(a.created||0));store.attempts.sort((a,b)=>(b.date||0)-(a.date||0));store.mirror();LS.set('cmd.tomb',SY_TOMB)}
    const rows=[];
    for(const id of Object.keys(SY_DIRTY)){
      const item=store.papers.find(x=>x.id===id)||store.attempts.find(x=>x.id===id);
      if(item){const u=updOf(item);if(remoteUpd[id]!==undefined&&remoteUpd[id]>=u){delete SY_DIRTY[id];continue}rows.push({user_id:SY.uid,id,kind:item.kind,data:item,upd:u,deleted:false})}
      else if(SY_TOMB[id]){if(remoteUpd[id]!==undefined&&remoteUpd[id]>=SY_TOMB[id]){delete SY_DIRTY[id];continue}rows.push({user_id:SY.uid,id,kind:'',data:null,upd:SY_TOMB[id],deleted:true})}
      else delete SY_DIRTY[id];
    }
    let up=0;
    for(let i=0;i<rows.length;i+=6){
      const b=rows.slice(i,i+6);
      await syRest(tok,'docs?on_conflict=user_id,id',{method:'POST',headers:{'Content-Type':'application/json',Prefer:'resolution=merge-duplicates,return=minimal'},body:JSON.stringify(b)});
      b.forEach(x=>delete SY_DIRTY[x.id]);up+=b.length;LS.set('cmd.dirty',SY_DIRTY);
    }
    LS.set('cmd.dirty',SY_DIRTY);
    SY.srv=maxSrv;SY.last=Date.now();SY.msg='Synced · '+down+' received, '+up+' sent';syPersist();
    if(changed&&V.view&&V.view!=='exam'&&V.view!=='instr'&&V.view!=='practice')try{render()}catch(e){}
    if(!silent)toast(SY.msg);
  }catch(e){SY_APPLYING=false;SY.msg='Sync failed: '+((e&&e.message)||e);syPersist();if(!silent)toast('Sync failed')}
  SY_BUSY=false;syPaint();
}
async function syAccount(create){
  SYERR='';
  const url=String(SYF['sy-url']!=null?SYF['sy-url']:SY.url).trim(),key=String(SYF['sy-key']!=null?SYF['sy-key']:SY.key).trim(),email=String(SYF['sy-email']!=null?SYF['sy-email']:SY.email).trim(),pass=String(SYF['sy-pass']||'');
  if(!/^https:\/\/[^\s/]+/.test(url)){SYERR='Enter the Project URL, like https://abcdxyz.supabase.co';syPaint();return}
  if(key.length<20){SYERR='Enter the anon / publishable key from Supabase Project Settings > API.';syPaint();return}
  if(!/.+@.+\..+/.test(email)){SYERR='Enter your email.';syPaint();return}
  if(pass.length<6){SYERR='Password must be at least 6 characters.';syPaint();return}
  SY.url=url;SY.key=key;SYWORK=create?'Creating your account…':'Signing in…';syPaint();
  try{
    const r=await syAuth(create?'signup':'token?grant_type=password',{email,password:pass});
    if(r.status>=400)throw new Error(syErrMsg(r));
    if(!r.j||!r.j.access_token)throw new Error('Account created, but Supabase wants an email confirmation first. Either open the link in the email Supabase sent, or in Supabase go to Authentication > Sign In / Providers > Email and turn off "Confirm email". Then press Sign in.');
    syTakeSession(r.j);SY.email=email;SY.msg='Connected';SY.last=0;SY.srv=0;SYWORK='';SYERR='';delete SYF['sy-pass'];syPersist();syPaint();syncNow();
  }catch(e){SYWORK='';SYERR=(e&&e.message)||String(e);syPaint()}
}
function syPanelHtml(){
  const warn=(!window.desk&&!window.Capacitor)?'<div class="msg info">Sync works in the Android app and the Windows app. This web page may be blocked by browser rules.</div>':'';
  const err=SYERR?`<div class="msg err" style="white-space:pre-wrap">${esc(SYERR)}</div>`:'';
  const work=SYWORK?`<div class="msg info">${esc(SYWORK)}</div>`:'';
  if(SY.refresh)return `<div class="stack">${warn}<div class="msg ok">Connected as ${esc(SY.email||'your account')}.</div>
   <div class="sub">${SY.last?'Last sync: '+fmtDate(SY.last)+'. ':''}${esc(SY.msg||'')}</div>
   <div class="sub">${store.papers.length} paper${store.papers.length===1?'':'s'} and ${store.attempts.length} attempt${store.attempts.length===1?'':'s'} on this device. Sync runs by itself when the app opens and a few seconds after each change.</div>
   <div class="row"><button class="btn pri" data-act="sysync" ${SY_BUSY?'disabled':''}>${SY_BUSY?'Syncing…':'Sync now'}</button><button class="btn" data-act="syfull">Re-download everything</button><button class="btn" data-act="sysignout">Sign out</button></div>${err}
   <div class="sub" style="font-size:12px">AI keys and settings are not synced; set them on each device. Use the same Supabase account on every device.</div></div>`;
  const v=(id,k)=>esc(SYF[id]!=null?SYF[id]:(SY[k]||''));
  return `<div class="stack">${warn}<div class="sub">Keep papers and attempts in sync across your phone and computer. One-time setup in Supabase (free), about 5 minutes.</div>
   <details><summary>Setup steps</summary><ol style="margin:8px 0 0 18px;display:flex;flex-direction:column;gap:6px">
    <li>Sign up at <b>supabase.com</b> and press <b>New project</b>. Choose any name and a database password (save it, you will not need it here).</li>
    <li>Open <b>SQL Editor</b>, press <b>New query</b>, paste the SQL below and press <b>Run</b>. <button class="btn sm" data-act="sycopysql">Copy SQL</button></li>
    <li>Open <b>Authentication &gt; Sign In / Providers &gt; Email</b> and turn <b>off</b> "Confirm email". Save.</li>
    <li>Open <b>Project Settings &gt; API Keys</b> (or the Connect button). Copy the <b>Project URL</b> and the <b>anon / publishable key</b> and paste them below.</li>
    <li>Choose an email and password here and press <b>Create account</b>. On your other devices use the same URL, key, email and password and press <b>Sign in</b>.</li></ol></details>
   <div class="field"><label for="sy-url">Project URL</label><input id="sy-url" value="${v('sy-url','url')}" autocomplete="off" autocapitalize="off" placeholder="https://abcdxyz.supabase.co"></div>
   <div class="field"><label for="sy-key">Anon / publishable key</label><input id="sy-key" value="${v('sy-key','key')}" autocomplete="off" autocapitalize="off" placeholder="eyJ... or sb_publishable_..."></div>
   <div class="field"><label for="sy-email">Email</label><input id="sy-email" type="email" value="${v('sy-email','email')}" autocomplete="email" autocapitalize="off"></div>
   <div class="field"><label for="sy-pass">Password</label><input id="sy-pass" type="password" value="${esc(SYF['sy-pass']||'')}" autocomplete="current-password"></div>
   <div class="row"><button class="btn pri" data-act="sysignin">Sign in</button><button class="btn" data-act="sysignup">Create account</button></div>${work}${err}</div>`;
}
function syPaint(){
  const z=document.getElementById('zoomov');if(!z||!z.dataset.sync)return;
  const sc=z.querySelector('.zoomscroll');if(!sc)return;
  const fid=document.activeElement&&document.activeElement.id;
  sc.innerHTML=syPanelHtml();
  if(fid&&fid.startsWith('sy-')){const e=document.getElementById(fid);if(e)e.focus()}
}
Object.assign(acts,{
  syopen(){openPanel('Cloud sync','Papers and attempts',syPanelHtml());document.getElementById('zoomov').dataset.sync='1'},
  sysignin(){return syAccount(false)},
  sysignup(){return syAccount(true)},
  sysync(){syncNow(false)},
  syfull(){SY.srv=0;SY.last=0;syPersist();syncNow(false)},
  sycopysql(){copyText(SB_SQL)},
  sysignout(){SY.refresh='';SY.access='';SY.msg='';SY.srv=0;SY.last=0;syPersist();SYERR='';syPaint();toast('Signed out. Data on this device is kept.')}
});
document.addEventListener('click',e=>{const t=e.target.closest&&e.target.closest('#zoomov [data-act^="sy"]');if(t&&acts[t.dataset.act])acts[t.dataset.act](t)});
document.addEventListener('input',e=>{const t=e.target;if(t&&t.id&&t.id.startsWith('sy-')&&t.closest&&t.closest('#zoomov'))SYF[t.id]=t.value});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target&&e.target.id&&e.target.id.startsWith('sy-')){e.preventDefault();syAccount(false)}});
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&SY.refresh&&Date.now()-(SY.last||0)>60000)syncNow(true)});
