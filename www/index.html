<style>
/* Layout: home/analysis are scrolling pages on a paper-blue ground; the exam is a fixed-height console (header, section bar, question pane + palette, action bar) modelled on the CAT screen. */
:root{
  --bg:#F4F6FA; --surface:#FFFFFF; --surface2:#F5F7FA; --ink:#14213A; --ink2:#4B5A72; --line:#D3DAE5;
  --accent:#1D5FA6; --accent-ink:#FFFFFF; --accent-soft:#E0ECF8;
  --good:#1E8A4C; --good-soft:#DDF1E5; --bad:#C23B3B; --bad-soft:#F8E1E1; --warn:#A96A0B; --warn-soft:#FBEBCF; --mark:#6B3FA0; --mark-soft:#ECE3F6;
  --none:#D5DAE2; --none-ink:#2B3547; --head:#1D5FA6; --head2:#154A83;
  --f-ui:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-serif:'IBM Plex Serif',Georgia,serif;
  --f-mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0E1524; --surface:#162033; --surface2:#1B273D; --ink:#E7ECF5; --ink2:#9FADC4; --line:#2B3A55;
  --accent:#6DA8F0; --accent-ink:#0B1424; --accent-soft:#1E3556;
  --good:#4CC983; --good-soft:#15392A; --bad:#F27B7B; --bad-soft:#442125; --warn:#E8B04F; --warn-soft:#3F3015; --mark:#B795E8; --mark-soft:#32254A;
  --none:#34425C; --none-ink:#E7ECF5; --head:#1B4577; --head2:#143560; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1524; --surface:#162033; --surface2:#1B273D; --ink:#E7ECF5; --ink2:#9FADC4; --line:#2B3A55;
  --accent:#6DA8F0; --accent-ink:#0B1424; --accent-soft:#1E3556;
  --good:#4CC983; --good-soft:#15392A; --bad:#F27B7B; --bad-soft:#442125; --warn:#E8B04F; --warn-soft:#3F3015; --mark:#B795E8; --mark-soft:#32254A;
  --none:#34425C; --none-ink:#E7ECF5; --head:#1B4577; --head2:#143560; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:14px/1.5 var(--f-ui);padding-left:max(10px,env(safe-area-inset-left,0px));padding-right:max(10px,env(safe-area-inset-right,0px))}

#app{min-height:100%}

button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{margin:0;text-wrap:balance}
.num,.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.wrap{max-width:min(100%,1760px);margin:0 auto;padding-block:14px 40px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-block:6px 18px}

.sub{color:var(--ink2)}

/* instructions */
.instr{max-width:820px;margin:0 auto}
.instr ol{padding-left:20px;display:flex;flex-direction:column;gap:6px}

  .xside{width:auto;border-left:0;border-top:1px solid var(--line)}
  .pal{overflow:visible}
  .xqa,.xq{overflow:visible}
}
.modal{position:fixed;inset:0;background:rgba(8,14,26,.6);display:grid;place-items:center;z-index:50;padding:16px}
.dlg{background:var(--surface);border-radius:6px;max-width:560px;width:100%;padding:20px;max-height:90vh;overflow:auto;border:1px solid var(--line)}
.dlg h2{font:600 18px var(--f-serif);margin-bottom:8px}

/* analysis */
.hero{display:grid;grid-template-columns:auto minmax(0,1fr);gap:22px;align-items:center}
@media(max-width:640px){.hero{grid-template-columns:minmax(0,1fr)}}
.score{font:600 54px/1 var(--f-serif)}
.score small{font:500 20px var(--f-mono);color:var(--ink2)}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-top:14px}
.tile{background:var(--surface2);border:1px solid var(--line);border-radius:4px;padding:10px 12px}
.tile b{display:block;font:600 22px var(--f-mono)}
.tile span{font-size:12px;color:var(--ink2)}
.ins{display:flex;flex-direction:column;gap:8px;padding:0;margin:0;list-style:none}
.ins li{padding:10px 12px;border-radius:4px;border-left:4px solid var(--accent);background:var(--surface2)}
.ins li.bad{border-color:var(--bad)}.ins li.warn{border-color:var(--warn)}.ins li.good{border-color:var(--good)}
.ins li b{display:block}
.ins li[data-act]{cursor:pointer}.ins li[data-act]:hover{filter:brightness(.97)}
.pg{margin:0 0 16px}
.pgh{display:flex;gap:6px 12px;align-items:baseline;flex-wrap:wrap;padding:4px 2px 8px;border-bottom:1px solid var(--line);margin-bottom:8px}
.pgh b{font-size:14px}.pgh.cur b{color:var(--accent)}
.pgh .sub{font-size:12.5px}
.pg>summary{list-style:none;cursor:pointer}.pg>summary::-webkit-details-marker{display:none}
.pg>summary:hover b{text-decoration:underline}
.pgc::before{content:'\25B8';display:inline-block;width:14px;color:var(--ink2)}
.pg[open]>summary .pgc::before{content:'\25BE'}
.tqs.tqbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.tqs.tqbar .grow{flex:1}
.tbar{cursor:pointer}.tbar:hover .bb{opacity:.7}
.qb[data-act]{cursor:pointer}.qb[data-act]:hover{outline:2px solid var(--ink);outline-offset:1px}
tr[data-act="qopen"]{cursor:pointer}
.ins li.bad,.ins li.warn,.ins li.good{color:var(--ink)}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:18px 0 12px}
.tabs button{border:1px solid var(--line);background:var(--surface);padding:7px 14px;border-radius:4px;font-weight:500}
.tabs button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.charts{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,440px),1fr));gap:16px}
svg.chart{width:100%;height:auto;display:block}
svg.chart[viewBox^="0 0 640 150"]{max-width:760px;max-height:190px}
svg text{fill:var(--ink2);font:11px var(--f-ui)}
svg text.v{font-family:var(--f-mono)}
.bar{height:8px;border-radius:2px;background:var(--line);overflow:hidden;display:flex;min-width:70px}
.bar i{display:block;height:100%}
.rev{border:1px solid var(--line);border-radius:6px;background:var(--surface);margin-bottom:10px;overflow:hidden}
.rev>summary{list-style:none;display:flex;gap:10px;align-items:center;padding:10px 12px;flex-wrap:wrap}
.rev>summary::-webkit-details-marker{display:none}
.rev .qn{font:600 13px var(--f-mono);min-width:44px}
.rev .qt{flex:1 1 220px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink)}
.pill{font-size:11.5px;font-weight:600;border-radius:3px;padding:2px 8px}
.pill.correct{background:var(--good-soft);color:var(--good)}
.pill.wrong{background:var(--bad-soft);color:var(--bad)}
.pill.skipped{background:var(--warn-soft);color:var(--warn)}
.pill.unseen{background:var(--surface2);color:var(--ink2);border:1px solid var(--line)}
.revbody{padding:4px 14px 14px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:10px}
.revbody .opts div{padding:5px 8px;border-radius:3px;white-space:pre-wrap}
.revbody .opts .c{background:var(--good-soft)}
.revbody .opts .w{background:var(--bad-soft)}
.sol{background:var(--accent-soft);border-radius:4px;padding:10px 12px;white-space:pre-wrap}
.sol.math{white-space:normal}
.sol.math>b{display:block;margin-bottom:4px}
.sol .st{display:flex;gap:10px;align-items:baseline;padding:5px 0}
.sol .st+.st{border-top:1px dashed color-mix(in srgb,var(--ink2) 30%,transparent)}
.sol .sn{flex:none;width:20px;height:20px;border-radius:50%;background:var(--accent);color:#fff;font:600 11px var(--f-ui);display:inline-grid;place-items:center;transform:translateY(-1px)}
.sol .sb{flex:1;min-width:0;line-height:1.75;overflow-wrap:anywhere}
.sol .st.eq .sb{font-family:var(--f-serif);font-size:17px}
.sol .st.fin .sb{font-weight:600}
.sol .st.fin .sn{background:var(--good)}
.m{font-family:var(--f-serif);font-size:1.08em}
.qai{margin-top:12px;border-top:1px dashed var(--line);padding-top:10px;display:flex;flex-direction:column;gap:8px}
.qai .qrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.qai .qrow input{flex:1 1 240px;min-width:0}
.qai .ql{font:600 11px var(--f-ui);letter-spacing:.08em;text-transform:uppercase;color:var(--ink2)}
.qai .qo{display:flex;flex-direction:column;gap:6px}
.qai .qm{font:500 11.5px var(--f-ui);color:var(--ink2);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.sol sub{font-size:.72em;line-height:0}
.qai .think{color:var(--ink2);font-style:italic}
.qnavbar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:12px;flex-wrap:wrap}
.qnavbar .btn{display:flex;align-items:center;gap:8px;max-width:46%}
.qnavbar .btn small{opacity:.75;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.qnavbar .mid{font:500 12.5px var(--f-mono);color:var(--ink2)}
.qnavbar .dot{width:9px;height:9px;border-radius:2px;flex:none}
.fr{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;line-height:1.15;font-size:.92em;margin:0 3px}
.fr i{font-style:normal;padding:0 3px}.fr i:first-child{border-bottom:1.5px solid currentColor}
.sol sup{font-size:.72em;line-height:0}
select.tag{border:1px solid var(--line);background:var(--surface);border-radius:4px;padding:3px 6px;font-size:12.5px}
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:4px;z-index:60;font-size:13px}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}

/* calculator */
.xhead .btn{background:var(--head2);color:#fff;border-color:rgba(255,255,255,.35)}
.calc{position:fixed;right:max(14px,env(safe-area-inset-right,0px));bottom:calc(64px + env(safe-area-inset-bottom,0px));width:min(224px,calc(100vw - 28px));background:var(--surface);border:1px solid var(--line);border-radius:6px;box-shadow:0 10px 30px rgba(0,0,0,.35);z-index:40;user-select:none}
.calc-h{display:flex;justify-content:space-between;align-items:center;padding:4px 6px 4px 10px;background:var(--head);color:#fff;border-radius:5px 5px 0 0;cursor:move;touch-action:none;font-weight:600;font-size:13px}
.calc-h .x{border:0;background:transparent;color:#fff;font-size:16px;line-height:1;padding:2px 6px;cursor:pointer}
.calc-d{padding:5px 10px;text-align:right;background:var(--surface2);border-bottom:1px solid var(--line);min-height:50px;overflow:hidden}
.calc-d .e{font:11.5px var(--f-mono);color:var(--ink2);min-height:15px;overflow-x:auto;white-space:nowrap}
.calc-d .r{font:600 19px var(--f-mono);overflow-x:auto;white-space:nowrap}
.calc-k{display:grid;grid-template-columns:repeat(5,1fr);gap:3px;padding:6px}
.calc-k button{padding:6px 0;border:1px solid var(--line);border-radius:4px;background:var(--surface2);font:600 12px var(--f-mono);min-width:0}
.calc-k button:active{filter:brightness(.92)}
.calc-k .op{background:var(--accent-soft);color:var(--accent)}
.calc-k .fn{font-size:12px}
.calc-k .eq{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.calc-k .clr{background:var(--bad-soft);color:var(--bad)}

.strip{display:flex;flex-wrap:wrap;gap:5px;margin:8px 0}
.qb{width:30px;height:28px;display:grid;place-items:center;border-radius:3px;color:#fff;font:600 12px var(--f-mono)}
.qb.unseen{color:var(--none-ink)}
.grp{font:600 19px var(--f-serif);margin:22px 0 4px;padding-bottom:4px;border-bottom:2px solid var(--ink)}
.grp2{font:600 13px var(--f-ui);letter-spacing:.06em;text-transform:uppercase;color:var(--ink2);margin:14px 0 6px}
.hist tr.subrow td{font-size:12.5px;background:var(--surface2)}
.aibox{line-height:1.65}
.aibox h4{font:600 16px var(--f-serif);margin:18px 0 6px}
.aibox ul,.aibox ol{margin:6px 0;padding-left:22px}
.aibox p{margin:6px 0}
.field{display:flex;flex-direction:column;gap:4px;min-width:190px;flex:1}
.field input,.field select{border:1px solid var(--line);background:var(--surface);border-radius:4px;padding:8px 10px;min-height:38px}

/* exam is always white, like the real paper */
.exam{--bg:#FFFFFF;--surface:#FFFFFF;--surface2:#F4F7FB;--ink:#1A2233;--ink2:#566176;--line:#D5DCE6;
  --accent:#1D5FA6;--accent-ink:#FFFFFF;--accent-soft:#E3EEFA;--good:#1E8A4C;--good-soft:#DDF1E5;--bad:#C23B3B;--bad-soft:#F8E1E1;--warn:#A96A0B;--warn-soft:#FBEBCF;
  --mark:#6B3FA0;--mark-soft:#ECE3F6;--none:#D5DAE2;--none-ink:#2B3547;--head:#1D5FA6;--head2:#154A83;color-scheme:light;background:#fff;color:var(--ink)}
body.exam-on{background:#fff}
.exam .xqhead{background:#EAF2FB;border-bottom:1px solid #C7D8EC;font-size:14px;padding:9px 18px}
.exam .xqhead>span:first-child{color:#154A83}
.exam .xpass{background:#fff;font-size:15.5px;line-height:1.75;padding:20px 24px}
.exam .xqa{padding:20px 26px}
.exam .qtext{font-size:17px;line-height:1.75;color:#111827;margin-bottom:20px}
.exam .opt{border:1px solid transparent;padding:11px 12px;margin-bottom:6px;font-size:15.5px;line-height:1.6;border-radius:5px}
.exam .opt:hover{background:#F3F7FC;border-color:var(--line)}
.exam .opt:has(input:checked){background:var(--accent-soft);border-color:var(--accent)}
.exam .opt input{width:17px;height:17px;margin-top:5px}
.exam .xside{background:#F4F7FB}
.exam .palhead{background:#1D5FA6;letter-spacing:.02em}
.exam .xact{box-shadow:0 -2px 6px rgba(20,33,58,.06);gap:10px}
.exam .xact .btn{padding:10px 18px;font-weight:600;border-radius:4px}
.exam .xact .btn.sv{padding:10px 26px}
.exam .tab{border-radius:3px}
.fb{margin-top:16px;border-radius:6px;padding:12px 14px;border:1px solid var(--line);background:var(--surface2)}
.fb.ok{background:var(--good-soft);border-color:var(--good)}
.fb.no{background:var(--bad-soft);border-color:var(--bad)}
.fb.na{background:var(--warn-soft);border-color:var(--warn)}
.exam .xsec{background:#F4F7FB}
.nm{border:1px solid var(--line);background:var(--surface);border-radius:4px;padding:5px 10px;min-height:30px;font-size:13px;width:150px}
/* ===== Material You skin: tonal surfaces, large radii, pill buttons, soft elevation. Applies to every screen except the live exam. ===== */
body:not(.exam-on){
  --bg:#F5F7FC; --surface:#FFFFFF; --surface2:#EEF2FA; --ink:#1B1F2A; --ink2:#454B5A; --line:#DCE2EE;
  --accent:#0B57D0; --accent-ink:#FFFFFF; --accent-soft:#D6E4FF;
  --good:#146C2E; --good-soft:#CDEED7; --bad:#B3261E; --bad-soft:#F9DEDC; --warn:#7A5900; --warn-soft:#FFE7A8; --mark:#6B3FA0; --mark-soft:#EADDFF;
  --f-ui:'Roboto Flex','Roboto','Google Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --m3-shadow:0 1px 2px rgba(31,41,70,.10),0 2px 8px 1px rgba(31,41,70,.06);
  --m3-shadow2:0 2px 6px rgba(31,41,70,.14),0 8px 24px 4px rgba(31,41,70,.08);
  background:radial-gradient(1200px 500px at 10% -10%,#E6EEFF 0,transparent 60%),radial-gradient(900px 400px at 100% 0,#F1E8FF 0,transparent 55%),var(--bg);
  background-attachment:fixed;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) body:not(.exam-on){
  --bg:#101318; --surface:#1A1E26; --surface2:#242935; --ink:#E4E6EE; --ink2:#C2C7D4; --line:#3A4151;
  --accent:#A8C7FA; --accent-ink:#062E6F; --accent-soft:#233B63;
  --good:#7FD99A; --good-soft:#163B25; --bad:#F2B8B5; --bad-soft:#4A2321; --warn:#F0CB66; --warn-soft:#3F3210; --mark:#D0BCFF; --mark-soft:#36285C;
  --m3-shadow:0 1px 2px rgba(0,0,0,.4);--m3-shadow2:0 4px 16px rgba(0,0,0,.5);
  background:radial-gradient(1000px 500px at 10% -10%,#17233D 0,transparent 60%),radial-gradient(800px 400px at 100% 0,#241A3D 0,transparent 55%),var(--bg)}}
:root[data-theme="dark"] body:not(.exam-on){
  --bg:#101318; --surface:#1A1E26; --surface2:#242935; --ink:#E4E6EE; --ink2:#C2C7D4; --line:#3A4151;
  --accent:#A8C7FA; --accent-ink:#062E6F; --accent-soft:#233B63;
  --good:#7FD99A; --good-soft:#163B25; --bad:#F2B8B5; --bad-soft:#4A2321; --warn:#F0CB66; --warn-soft:#3F3210; --mark:#D0BCFF; --mark-soft:#36285C;
  --m3-shadow:0 1px 2px rgba(0,0,0,.4);--m3-shadow2:0 4px 16px rgba(0,0,0,.5);
  background:radial-gradient(1000px 500px at 10% -10%,#17233D 0,transparent 60%),radial-gradient(800px 400px at 100% 0,#241A3D 0,transparent 55%),var(--bg)}
body:not(.exam-on) .brand{font:500 24px var(--f-ui);letter-spacing:0;display:flex;align-items:center}
body:not(.exam-on) .brand::before{content:"";width:34px;height:34px;margin-right:12px;border-radius:12px 12px 12px 4px;background:linear-gradient(135deg,#0B57D0 0%,#6E9BFF 60%,#B99BFF 100%);box-shadow:var(--m3-shadow)}
body:not(.exam-on) .brand small{font:500 12px var(--f-ui);letter-spacing:.04em;text-transform:none;background:var(--accent-soft);color:var(--accent);padding:3px 10px;border-radius:99px;margin-left:12px}
body:not(.exam-on) .top{padding-block:8px 20px}
body:not(.exam-on) .panel{background:var(--surface);border:0;border-radius:28px;padding:24px;box-shadow:var(--m3-shadow)}
body:not(.exam-on) .panel h2{font:500 22px/1.3 var(--f-ui);margin-bottom:2px}
body:not(.exam-on) .panel h3{font:500 12px var(--f-ui);letter-spacing:.08em}
body:not(.exam-on) .btn{border:1px solid color-mix(in srgb,var(--ink2) 45%,transparent);background:transparent;color:var(--accent);border-radius:999px;padding:8px 20px;min-height:40px;font-weight:500;letter-spacing:.01em;transition:background-color .18s,box-shadow .18s,transform .1s,border-color .18s}
body:not(.exam-on) .btn:hover{background:color-mix(in srgb,var(--accent) 9%,transparent);border-color:color-mix(in srgb,var(--accent) 55%,transparent)}
body:not(.exam-on) .btn:active{transform:scale(.97)}
body:not(.exam-on) .btn.pri{background:var(--accent);color:var(--accent-ink);border-color:transparent;box-shadow:var(--m3-shadow)}
body:not(.exam-on) .btn.pri:hover{filter:none;box-shadow:var(--m3-shadow2);background:color-mix(in srgb,var(--accent) 88%,#fff)}
body:not(.exam-on) .btn.sm{padding:4px 14px;min-height:32px;font-size:13px}
body:not(.exam-on) .btn.danger{color:var(--bad)}
body:not(.exam-on) .btn.danger:hover{background:color-mix(in srgb,var(--bad) 10%,transparent);border-color:var(--bad)}

body:not(.exam-on) .chip{border:0;border-radius:10px;background:var(--surface2);padding:3px 10px;font-weight:500;color:var(--ink2)}
body:not(.exam-on) .chip.on{background:var(--accent);color:var(--accent-ink)}
body:not(.exam-on) .drop{border:2px dashed color-mix(in srgb,var(--accent) 40%,var(--line));border-radius:24px;background:color-mix(in srgb,var(--accent-soft) 40%,var(--surface));padding:28px 16px}
body:not(.exam-on) .drop.over{background:var(--accent-soft);border-color:var(--accent)}
body:not(.exam-on) textarea.paste,body:not(.exam-on) pre.prompt{border:0;border-radius:18px;background:var(--surface2);padding:14px}
body:not(.exam-on) textarea.paste:focus{outline:2px solid var(--accent);outline-offset:0}
body:not(.exam-on) .nm,body:not(.exam-on) .field input,body:not(.exam-on) .field select,body:not(.exam-on) select.tag{border:0;background:var(--surface2);border-radius:999px;padding:6px 14px;min-height:36px}
body:not(.exam-on) .nm:focus,body:not(.exam-on) .field input:focus{outline:2px solid var(--accent);outline-offset:0}
body:not(.exam-on) .msg{border-radius:16px;padding:12px 16px}
body:not(.exam-on) .paper{grid-template-columns:minmax(0,1fr);background:var(--surface2);border:0;border-radius:20px;padding:14px 16px;margin-top:8px;transition:box-shadow .2s,transform .2s}
body:not(.exam-on) .paper:hover{box-shadow:var(--m3-shadow)}
body:not(.exam-on) .banner{border:0;border-radius:22px;background:var(--warn-soft);color:var(--ink)}
body:not(.exam-on) .hist th{border-bottom:1px solid var(--line);padding:10px 10px}
body:not(.exam-on) .hist tbody tr{transition:background-color .15s}
body:not(.exam-on) .hist tbody tr:hover{background:var(--surface2)}
body:not(.exam-on) .hist td{border-bottom:1px solid color-mix(in srgb,var(--line) 60%,transparent);padding:10px}
body:not(.exam-on) .seg{border:0;background:var(--surface2);border-radius:999px;padding:3px;gap:2px}

body:not(.exam-on) .seg button.on{background:var(--accent);color:var(--accent-ink)}
body:not(.exam-on) .tabs button{border:0;border-radius:999px;background:var(--surface2);padding:8px 18px}
body:not(.exam-on) .tabs button.on,body:not(.exam-on) .tabs button[aria-selected="true"]{background:var(--accent);color:var(--accent-ink)}
body:not(.exam-on) .tile{border:0;border-radius:20px;background:var(--surface2);padding:14px 16px}
body:not(.exam-on) .ins li{border-radius:16px;border-left-width:0;background:var(--surface2);padding:12px 16px}
body:not(.exam-on) .rev{border:0;border-radius:22px;background:var(--surface);box-shadow:var(--m3-shadow)}
body:not(.exam-on) .pill{border-radius:99px;padding:2px 10px}
body:not(.exam-on) .sol{border-radius:16px}
body:not(.exam-on) .bar{border-radius:99px;height:10px}
body:not(.exam-on) .sectbl{border-collapse:separate;border-spacing:0;border-radius:16px;overflow:hidden}
body:not(.exam-on) .sectbl th,body:not(.exam-on) .sectbl td{border:0;border-bottom:1px solid var(--line)}
body:not(.exam-on) .sectbl th{background:var(--surface2)}
body:not(.exam-on) .dlg{border:0;border-radius:28px;padding:24px;box-shadow:var(--m3-shadow2)}
body:not(.exam-on) .toast{border-radius:14px}
body:not(.exam-on) details{border-radius:16px}
body:not(.exam-on) details>summary{padding:6px 2px}
body:not(.exam-on) .wrap.enter>*{animation:m3rise .28s cubic-bezier(.2,.8,.2,1) both}
body:not(.exam-on) .wrap.enter>*:nth-child(2){animation-delay:.02s}
body:not(.exam-on) .wrap.enter>*:nth-child(3){animation-delay:.04s}
body:not(.exam-on) .wrap.enter>*:nth-child(n+4){animation-delay:.06s}
@keyframes m3rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){body:not(.exam-on) .wrap.enter>*{animation:none}body:not(.exam-on) .btn,body:not(.exam-on) .paper{transition:none}}
/* import review */
.imq{background:var(--surface2);border-radius:20px;margin-top:8px;padding:2px 16px}
.imq>summary{display:flex;gap:10px;align-items:center;padding:12px 0;list-style:none}

/* ---------- paper parsing ---------- */
const AI_PROMPT=`Create a CAT mock test as ONE valid JSON object. Output only the JSON, no commentary, no markdown fences.

Structure:
{
  "title": "CAT Mock 1",
  "sections": [
    { "name": "VARC", "minutes": 40, "questions": [ ...24 questions... ] },
    { "name": "DILR", "minutes": 40, "questions": [ ...20 questions... ] },
    { "name": "QA",   "minutes": 40, "questions": [ ...22 questions... ] }
  ]
}

Each question:
{
  "type": "mcq" or "tita",
  "topic": "e.g. Reading Comprehension, Para Jumbles, Seating Arrangement, Geometry",
  "subtopic": "the question type inside the topic, e.g. Inference, Main Idea, Sum of AP, Triangles",
  "difficulty": "easy" or "medium" or "hard",
  "passage": "full passage / data set text shared by a group of questions (repeat the identical text on every question of the group; omit for standalone questions)",
  "question": "question text",
  "options": ["option A text", "option B text", "option C text", "option D text"],
  "answer": "B",
  "marks": 3,
  "negative": 1,
  "solution": "short step-by-step explanation"
}

Rules:
- For "mcq": give 4 options WITHOUT letter prefixes and set "answer" to the letter A, B, C or D.
- For "tita" (type-in-the-answer): omit "options" and set "answer" to the number or text to type, as a string. Use "negative": 0.
- Put tables in "passage" as plain text rows, one row per line.
- Every question needs topic, subtopic, difficulty and solution.`;

function normalizePaper(raw){
  if(typeof raw==='string'){raw=raw.trim().replace(/^```(?:json)?/i,'').replace(/```$/,'').trim();raw=JSON.parse(raw)}
  if(Array.isArray(raw))raw={questions:raw};
  const errs=[];
  const pmap=raw.passages||{};
  let secIn=raw.sections;
  if(!Array.isArray(secIn)){
    if(!Array.isArray(raw.questions))throw new Error('No "sections" or "questions" found in the file.');
    const g={};raw.questions.forEach(q=>{const n=q.section||'Section 1';(g[n]=g[n]||[]).push(q)});
    secIn=Object.keys(g).map(n=>({name:n,minutes:40,questions:g[n]}));
  }
  const sections=[],questions=[];
  secIn.forEach((s,si)=>{
    const qs=s.questions||[];
    sections.push({name:String(s.name||'Section '+(si+1)),minutes:+s.minutes||40,count:qs.length});
    const spm=Object.assign({},s.passages||{});
    qs.forEach((q,qi)=>{
      const label=sections[si].name+' Q'+(qi+1);
      const text=q.question||q.text||q.q||'';
      let opts=q.options||q.choices||null;
      let type=(q.type||(opts&&opts.length?'mcq':'tita')).toLowerCase();
      type=type.indexOf('tita')>=0||type==='numeric'||type==='fill'||type==='input'?'tita':'mcq';
      if(!text){errs.push(label+': missing question text');return}
      let ans=q.answer!=null?q.answer:(q.correct!=null?q.correct:(q.correct_answer!=null?q.correct_answer:q.correctAnswer));
      if(ans==null){errs.push(label+': missing answer');return}
      let ai=null;
      if(type==='mcq'){
        if(!Array.isArray(opts)||opts.length<2){errs.push(label+': MCQ needs at least 2 options');return}
        opts=opts.map(o=>String(o).replace(/^\s*\(?[A-Ha-h][\)\.:]\s+/,''));
        const a=String(ans).trim();
        if(/^[A-Ha-h]$/.test(a))ai=a.toUpperCase().charCodeAt(0)-65;
        else if(/^[1-9]$/.test(a))ai=+a-1;
        else{const k=opts.findIndex(o=>o.trim().toLowerCase()===a.toLowerCase());if(k>=0)ai=k}
        if(ai==null||ai>=opts.length){errs.push(label+': answer "'+a+'" does not match an option');return}
      }
      let passage=q.passage||'';
      if(!passage&&q.passageId)passage=spm[q.passageId]||pmap[q.passageId]||'';

function parsePct(txt){

    const n=l.replace(/%/g,'').match(/-?\d+(?:\.\d+)?/g);
    if(!n||n.length<2){bad.push(l);return}
    const m=+n[0],p=+n[1];if(!(p>=0&&p<=100)){bad.push(l);return}
    rows.push([m,p]);

function pctOf(P,score){

  const L=t[t.length-1];
  if(score>=L[0])return {v:L[1],txt:(score>L[0]?'> ':'')+f(L[1]),hi:score>L[0]};

    if(score<=b[0]){const v=a[1]+(b[1]-a[1])*(score-a[0])/(b[0]-a[0]);return {v,txt:'~'+f(v)}}}

}
