<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>CAT Mock Desk</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="app-build" content="2026-10-31.03">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wght@8..144,400;8..144,500;8..144,600&family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Serif:wght@400;600&display=swap">
<style>
/* Layout: home/analysis are scrolling pages on a paper-blue ground; the exam is a fixed-height console (header, section bar, question pane + palette, action bar) modelled on the CAT screen. */
:root{
  --bg:#F4F6FA; --surface:#FFFFFF; --surface2:#F5F7FA; --ink:#14213A; --ink2:#4B5A72; --line:#D3DAE5;
  --accent:#1D5FA6; --accent-ink:#FFFFFF; --accent-soft:#E0ECF8;
  --good:#1E8A4C; --good-soft:#DDF1E5; --bad:#C23B3B; --bad-soft:#F8E1E1; --warn:#A96A0B; --warn-soft:#FBEBCF; --mark:#6B3FA0; --mark-soft:#ECE3F6;
  --none:#D5DAE2; --none-ink:#2B3547; --head:#1D5FA6; --head2:#154A83;
  --f-ui:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-serif:'IBM Plex Serif',Georgia,serif;
  --f-mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0E1524; --surface:#162033; --surface2:#1B273D; --ink:#E7ECF5; --ink2:#9FADC4; --line:#2B3A55;
  --accent:#6DA8F0; --accent-ink:#0B1424; --accent-soft:#1E3556;
  --good:#4CC983; --good-soft:#15392A; --bad:#F27B7B; --bad-soft:#442125; --warn:#E8B04F; --warn-soft:#3F3015; --mark:#B795E8; --mark-soft:#32254A;
  --none:#34425C; --none-ink:#E7ECF5; --head:#1B4577; --head2:#143560; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1524; --surface:#162033; --surface2:#1B273D; --ink:#E7ECF5; --ink2:#9FADC4; --line:#2B3A55;
  --accent:#6DA8F0; --accent-ink:#0B1424; --accent-soft:#1E3556;
  --good:#4CC983; --good-soft:#15392A; --bad:#F27B7B; --bad-soft:#442125; --warn:#E8B04F; --warn-soft:#3F3015; --mark:#B795E8; --mark-soft:#32254A;
  --none:#34425C; --none-ink:#E7ECF5; --head:#1B4577; --head2:#143560; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:14px/1.5 var(--f-ui);padding-left:max(10px,env(safe-area-inset-left,0px));padding-right:max(10px,env(safe-area-inset-right,0px))}
body.exam-on{padding-left:0;padding-right:0;overflow:hidden}
#app{min-height:100%}
#app.is-exam{height:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{margin:0;text-wrap:balance}
.num,.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.wrap{max-width:min(100%,1760px);margin:0 auto;padding-block:14px 40px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-block:6px 18px}
.brand{font:600 20px var(--f-serif);letter-spacing:.01em}
.brand small{font:500 11px var(--f-ui);letter-spacing:.12em;text-transform:uppercase;color:var(--ink2);margin-left:10px}
.sub{color:var(--ink2)}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:4px;padding:8px 14px;font-weight:500;min-height:38px}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.pri:hover{filter:brightness(1.08)}
.btn.sm{padding:4px 10px;min-height:30px;font-size:13px}
.btn.danger{color:var(--bad)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.grid2{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:18px}
@media(max-width:860px){.grid2{grid-template-columns:minmax(0,1fr)}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:18px}
.panel h2{font:600 17px var(--f-serif);margin-bottom:4px}
.panel h3{font:600 13px var(--f-ui);letter-spacing:.08em;text-transform:uppercase;color:var(--ink2);margin-bottom:10px}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.drop{border:1.5px dashed var(--line);border-radius:6px;padding:22px 16px;text-align:center;background:var(--surface2);transition:border-color .15s}
.drop.over{border-color:var(--accent);background:var(--accent-soft)}
textarea.paste{width:100%;min-height:96px;resize:vertical;background:var(--surface2);border:1px solid var(--line);border-radius:4px;padding:10px;font:12px/1.45 var(--f-mono)}
.msg{padding:8px 12px;border-radius:4px;font-size:13px}
.msg.err{background:var(--bad-soft);color:var(--bad)}
.msg.ok{background:var(--good-soft);color:var(--good)}
.msg.info{background:var(--accent-soft);color:var(--accent)}
.paper{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px 14px;padding:14px 0;border-top:1px solid var(--line);align-items:center}
.paper:first-of-type{border-top:0}
.paper .t{font-weight:600}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font-size:12px;border:1px solid var(--line);border-radius:99px;padding:1px 9px;background:var(--surface2);color:var(--ink2)}
.chip.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
button.chip{cursor:pointer}
.hist{width:100%;border-collapse:collapse;font-size:13px}
.hist th{text-align:left;font-weight:500;color:var(--ink2);font-size:12px;padding:6px 8px;border-bottom:1px solid var(--line)}
.hist td{padding:8px;border-bottom:1px solid var(--line);vertical-align:middle}
.tablewrap{overflow-x:auto}
.addgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px}
@media(max-width:760px){.addgrid{grid-template-columns:minmax(0,1fr)}}
.cattiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-top:18px}
@media(max-width:860px){.cattiles{grid-template-columns:minmax(0,1fr)}}
.cattile{display:flex;flex-direction:column;gap:8px;text-align:left;border:0;background:var(--tile);color:var(--ink);border-radius:28px;padding:22px 24px;min-height:190px;transition:transform .15s,box-shadow .2s;position:relative}
.cattile:hover{transform:translateY(-2px);box-shadow:var(--m3-shadow2,0 6px 18px rgba(0,0,0,.12))}
.cattile .ct-name{font:600 21px var(--f-ui)}
.cattile .ct-desc{color:var(--ink2);font-size:13.5px;line-height:1.45}
.cattile .ct-stats{display:flex;gap:6px 14px;flex-wrap:wrap;margin-top:auto;font-size:13px;color:var(--ink2)}
.cattile .ct-stats b{color:var(--ink);font-size:15px}
.cattile .ct-go{position:absolute;right:22px;top:22px;font-weight:600;color:var(--accent)}
.subjgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
@media(max-width:940px){.subjgrid{grid-template-columns:minmax(0,1fr)}}
.subj{background:var(--surface2);border-radius:22px;padding:14px 18px}
.slider{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;padding:4px 2px 8px;margin:6px 0 10px}
.slider button{flex:1 0 150px;scroll-snap-align:start;border-radius:999px;padding:12px 20px;border:1px solid var(--line);background:var(--surface2);font-weight:600;font-size:14.5px;white-space:nowrap}
.slider button.on{background:var(--accent);color:var(--accent-ink);border-color:transparent;box-shadow:var(--m3-shadow,none)}
.slider button small{font-weight:500;opacity:.8;margin-left:6px}
.plist{max-height:min(560px,62vh);overflow:auto;padding-right:4px;scrollbar-width:thin}
.good{color:var(--good)}.bad{color:var(--bad)}.warn{color:var(--warn)}
.banner{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:var(--warn-soft);border:1px solid var(--warn);border-radius:6px;padding:12px 16px;margin-bottom:16px}
pre.prompt{white-space:pre-wrap;background:var(--surface2);border:1px solid var(--line);border-radius:4px;padding:10px;font:12px/1.5 var(--f-mono);max-height:220px;overflow:auto;margin:8px 0}
details>summary{cursor:pointer;font-weight:500}

/* instructions */
.instr{max-width:820px;margin:0 auto}
.instr ol{padding-left:20px;display:flex;flex-direction:column;gap:6px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:4px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:8px 14px}
.seg button.on{background:var(--accent);color:var(--accent-ink)}
.sectbl{width:100%;border-collapse:collapse;margin:8px 0}
.sectbl th,.sectbl td{border:1px solid var(--line);padding:6px 10px;text-align:left;font-size:13px}
.sectbl th{background:var(--surface2);font-weight:500}

/* exam console */
.exam{height:100%;display:flex;flex-direction:column;background:var(--surface)}
.xhead{background:var(--head);color:#fff;display:flex;justify-content:space-between;align-items:center;gap:12px;padding:8px max(14px,env(safe-area-inset-right,0px)) 8px max(14px,env(safe-area-inset-left,0px));flex-wrap:wrap}
.xhead .ttl{font-weight:600;font-size:15px}
.xhead .timer{font:600 15px var(--f-mono);background:var(--head2);padding:4px 12px;border-radius:3px}
.xhead .timer.low{background:var(--bad)}
.xsec{display:flex;align-items:center;gap:6px;background:var(--surface2);border-bottom:1px solid var(--line);padding:6px max(14px,env(safe-area-inset-right,0px)) 6px max(14px,env(safe-area-inset-left,0px));overflow-x:auto;flex-wrap:nowrap}
.xsec .tab{border:1px solid var(--line);background:var(--surface);padding:5px 14px;border-radius:3px;font-weight:600;font-size:13px;white-space:nowrap}
.xsec .tab.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.xsec .tab.lock{opacity:.5}
.xsec .info{margin-left:auto;font-size:12px;color:var(--ink2);white-space:nowrap}
.xmain{flex:1;min-height:0;display:flex}
.xq{flex:1;min-width:0;display:flex;flex-direction:column}
.xqhead{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 16px;border-bottom:1px solid var(--line);font-weight:600;flex-wrap:wrap}
.xqhead .mk{font:500 12.5px var(--f-mono);color:var(--ink2)}
.xqhead .mk b{color:var(--good)}.xqhead .mk i{color:var(--bad);font-style:normal;font-weight:600}
.xbody{flex:1;min-height:0;display:flex}
.xpass{flex:1 1 50%;min-width:0;overflow:auto;padding:16px 20px;border-right:1px solid var(--line);font:15px/1.7 var(--f-serif);white-space:pre-wrap}
.xpass .plabel{font:600 11px var(--f-ui);letter-spacing:.1em;text-transform:uppercase;color:var(--ink2);display:block;margin-bottom:8px}
.zoomov{position:fixed;inset:0;z-index:80;background:rgba(8,14,26,.62);display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr);place-items:center;padding:16px;overflow:hidden}
.zoombox{background:var(--surface);color:var(--ink);border-radius:24px;box-shadow:0 20px 60px rgba(0,0,0,.4);width:min(1240px,100%);max-width:100%;min-width:0;max-height:100%;display:flex;flex-direction:column;padding:16px 20px 20px;box-sizing:border-box}
.zoombar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.zoombar b{flex:1;min-width:140px;font-size:16px}
.zoomscroll{overflow:auto;min-width:0;border-radius:12px;background:var(--surface2);padding:8px}
.zoombox .rev,.zoombox .revbody,.zoombox .tq,.zoombox .pg{min-width:0;max-width:100%}
.zoombox .revbody{overflow-wrap:anywhere}
.zoombox svg.chart{max-width:none!important;max-height:none!important;width:var(--zw,100%);cursor:default}
body:not(.exam-on) svg.chart{cursor:zoom-in}

.prow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 12px;align-items:center;padding:10px 14px;border-radius:16px;background:var(--surface2)}
.prow .pmain .t{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prow .pbtn{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.prow .pctl{grid-column:1/-1;display:flex;gap:14px;flex-wrap:wrap}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(500px,1fr));gap:8px}
@media(max-width:560px){.pgrid{grid-template-columns:minmax(0,1fr)}}
.more{position:relative;display:inline-block}
.dueb{display:inline-grid;place-items:center;min-width:18px;height:18px;padding:0 5px;margin-left:4px;border-radius:99px;background:var(--bad);color:#fff;font:600 11px var(--f-ui)}
@media (max-width:640px){
  .top{display:block}
  .homebar{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;width:100%;margin-top:12px}
  .homebar .nm{grid-column:1/-1;width:100%;max-width:none}
  .homebar>.btn,.homebar>.more,.homebar>.more>summary{width:100%;min-width:0}
  .homebar .btn{justify-content:center;text-align:center;padding-inline:6px;white-space:nowrap;font-size:13px}
  .homebar>.more>summary{display:flex;align-items:center;justify-content:center;white-space:nowrap}
}
.more[open]{z-index:60}
.top{position:relative;z-index:50}
.more>summary{list-style:none;cursor:pointer}
.more>summary::-webkit-details-marker{display:none}
.more .menu{position:absolute;right:0;top:calc(100% + 4px);max-width:calc(100vw - 16px);z-index:30;background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:0 8px 28px rgba(0,0,0,.22);padding:6px;display:flex;flex-direction:column;gap:2px;min-width:200px}
body:not(.exam-on) .more .menu .btn{border:0;border-radius:10px;justify-content:flex-start;text-align:left;width:100%;min-height:34px;padding:6px 12px}
.subjgrid.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media(max-width:1100px){.subjgrid.g4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:600px){.subjgrid.g4{grid-template-columns:minmax(0,1fr)}}
.dropbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;border:1.5px dashed var(--line);border-radius:20px;padding:12px 16px;background:var(--surface2);text-align:left}
.dropbar .grow{flex:1;min-width:180px}
tr.toprow{cursor:pointer}
tr.toprow:hover td{background:var(--surface2)}
.subj.empty{align-self:start}
.tcaret{display:inline-block;width:16px;color:var(--ink2)}
tr.tqrow>td{padding:6px 8px 14px;background:var(--surface2)}
.tq .tqh{display:flex;gap:8px;align-items:center;margin:4px 0 8px;flex-wrap:wrap}
.tq .tqs{font:600 12px var(--f-ui);letter-spacing:.06em;text-transform:uppercase;color:var(--ink2);margin:14px 0 6px}
.hdet>summary{font:600 17px var(--f-serif);cursor:pointer;padding:2px 0}
.xdiv{flex:0 0 9px;cursor:col-resize;touch-action:none;position:relative;background:var(--surface2);border-left:1px solid var(--line);border-right:1px solid var(--line)}
.xdiv::after{content:'';position:absolute;left:50%;top:50%;width:3px;height:44px;margin:-22px 0 0 -1.5px;border-radius:2px;background:#9AA7BC}
.xdiv:hover::after,.xdiv.drag::after{background:var(--accent)}
@media(max-width:860px){.xdiv{display:none}}
.xqa{flex:1 1 50%;min-width:0;overflow:auto;padding:16px 20px}
.qtext{font:16px/1.65 var(--f-serif);white-space:pre-wrap;margin-bottom:16px}
.opt{display:flex;gap:10px;align-items:flex-start;padding:9px 10px;border-radius:4px;cursor:pointer}
.opt:hover{background:var(--surface2)}
.opt input{margin-top:5px;accent-color:var(--accent)}
.opt span{white-space:pre-wrap}
.tita{display:flex;flex-direction:column;gap:10px;max-width:260px}
.tita input.ans{font:600 18px var(--f-mono);padding:8px 10px;border:1px solid var(--line);border-radius:4px;background:var(--surface);text-align:right}
.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.keys button{padding:10px 0;border:1px solid var(--line);border-radius:4px;background:var(--surface2);font:600 15px var(--f-mono)}
.keys button.w2{grid-column:span 2}
.xside{width:290px;flex:none;border-left:1px solid var(--line);background:var(--surface2);display:flex;flex-direction:column;min-height:0}
.who{display:flex;gap:10px;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)}
.avatar{width:42px;height:42px;border-radius:4px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font:600 18px var(--f-serif)}
.legend{display:grid;grid-template-columns:1fr 1fr;gap:8px 6px;padding:12px 14px;border-bottom:1px solid var(--line);font-size:12px}
.legend div{display:flex;align-items:center;gap:7px}
.legend .pb{width:26px;height:24px;font-size:11px;cursor:default}
.palhead{padding:8px 14px;font-weight:600;background:var(--head);color:#fff;font-size:13px}
.pal{flex:1;min-height:0;overflow:auto;padding:12px 14px;display:grid;grid-template-columns:repeat(auto-fill,minmax(40px,1fr));gap:8px;align-content:start}
.pb{width:36px;height:32px;display:grid;place-items:center;font:600 13px var(--f-mono);color:var(--none-ink);background:var(--none);border-radius:3px;border:0;position:relative;padding:0}
.pb.na{background:var(--bad);color:#fff;border-radius:3px 3px 15px 15px}
.pb.ans{background:var(--good);color:#fff;border-radius:15px 15px 3px 3px}
.pb.mk{background:var(--mark);color:#fff;border-radius:50%;width:34px;height:34px}
.pb.mkans{background:var(--mark);color:#fff;border-radius:50%;width:34px;height:34px}
.pb.mkans::after{content:"";position:absolute;right:-2px;bottom:-2px;width:11px;height:11px;border-radius:50%;background:var(--good);border:2px solid var(--surface2)}
.pb.cur{outline:2px solid var(--ink);outline-offset:2px}
.xsubmit{padding:10px 14px;border-top:1px solid var(--line)}
.xact{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:8px max(14px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(14px,env(safe-area-inset-left,0px));border-top:1px solid var(--line);background:var(--surface)}
.xact .sp{flex:1}
.xact .btn.mrk{background:var(--mark-soft);color:var(--mark);border-color:var(--mark)}
.xact .btn.sv{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
@media(max-width:860px){
  .xmain{flex-direction:column;overflow:auto}
  .xq{flex:none}
  .xbody{flex-direction:column}
  .xpass{border-right:0;border-bottom:1px solid var(--line);max-height:42vh;flex:none}
  .xside{width:auto;border-left:0;border-top:1px solid var(--line)}
  .pal{overflow:visible}
  .xqa,.xq{overflow:visible}
}
.modal{position:fixed;inset:0;background:rgba(8,14,26,.6);display:grid;place-items:center;z-index:50;padding:16px}
.dlg{background:var(--surface);border-radius:6px;max-width:560px;width:100%;padding:20px;max-height:90vh;overflow:auto;border:1px solid var(--line)}
.dlg h2{font:600 18px var(--f-serif);margin-bottom:8px}

/* analysis */
.hero{display:grid;grid-template-columns:auto minmax(0,1fr);gap:22px;align-items:center}
@media(max-width:640px){.hero{grid-template-columns:minmax(0,1fr)}}
.score{font:600 54px/1 var(--f-serif)}
.score small{font:500 20px var(--f-mono);color:var(--ink2)}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-top:14px}
.tile{background:var(--surface2);border:1px solid var(--line);border-radius:4px;padding:10px 12px}
.tile b{display:block;font:600 22px var(--f-mono)}
.tile span{font-size:12px;color:var(--ink2)}
.ins{display:flex;flex-direction:column;gap:8px;padding:0;margin:0;list-style:none}
.ins li{padding:10px 12px;border-radius:4px;border-left:4px solid var(--accent);background:var(--surface2)}
.ins li.bad{border-color:var(--bad)}.ins li.warn{border-color:var(--warn)}.ins li.good{border-color:var(--good)}
.ins li b{display:block}
.ins li[data-act]{cursor:pointer}.ins li[data-act]:hover{filter:brightness(.97)}
.pg{margin:0 0 16px}
.pgh{display:flex;gap:6px 12px;align-items:baseline;flex-wrap:wrap;padding:4px 2px 8px;border-bottom:1px solid var(--line);margin-bottom:8px}
.pgh b{font-size:14px}.pgh.cur b{color:var(--accent)}
.pgh .sub{font-size:12.5px}

function normalizePaper(raw){
  if(typeof raw==='string'){raw=raw.trim().replace(/^```(?:json)?/i,'').replace(/```$/,'').trim();raw=JSON.parse(raw)}
  if(Array.isArray(raw))raw={questions:raw};
  const errs=[];
  const pmap=raw.passages||{};
  let secIn=raw.sections;
  if(!Array.isArray(secIn)){
    if(!Array.isArray(raw.questions))throw new Error('No "sections" or "questions" found in the file.');
    const g={};raw.questions.forEach(q=>{const n=q.section||'Section 1';(g[n]=g[n]||[]).push(q)});
    secIn=Object.keys(g).map(n=>({name:n,minutes:40,questions:g[n]}));
  }
  const sections=[],questions=[];
  secIn.forEach((s,si)=>{
    const qs=s.questions||[];
    sections.push({name:String(s.name||'Section '+(si+1)),minutes:+s.minutes||40,count:qs.length});
    const spm=Object.assign({},s.passages||{});
    qs.forEach((q,qi)=>{
      const label=sections[si].name+' Q'+(qi+1);
      const text=q.question||q.text||q.q||'';
      let opts=q.options||q.choices||null;
      let type=(q.type||(opts&&opts.length?'mcq':'tita')).toLowerCase();
      type=type.indexOf('tita')>=0||type==='numeric'||type==='fill'||type==='input'?'tita':'mcq';
      if(!text){errs.push(label+': missing question text');return}
      let ans=q.answer!=null?q.answer:(q.correct!=null?q.correct:(q.correct_answer!=null?q.correct_answer:q.correctAnswer));
      if(ans==null){errs.push(label+': missing answer');return}
      let ai=null;
      if(type==='mcq'){
        if(!Array.isArray(opts)||opts.length<2){errs.push(label+': MCQ needs at least 2 options');return}
        opts=opts.map(o=>String(o).replace(/^\s*\(?[A-Ha-h][\)\.:]\s+/,''));
        const a=String(ans).trim();
        if(/^[A-Ha-h]$/.test(a))ai=a.toUpperCase().charCodeAt(0)-65;
        else if(/^[1-9]$/.test(a))ai=+a-1;
        else{const k=opts.findIndex(o=>o.trim().toLowerCase()===a.toLowerCase());if(k>=0)ai=k}
        if(ai==null||ai>=opts.length){errs.push(label+': answer "'+a+'" does not match an option');return}
      }
      let passage=q.passage||'';
      if(!passage&&q.passageId)passage=spm[q.passageId]||pmap[q.passageId]||'';
      const d=String(q.difficulty||'medium').toLowerCase();
      let tp=String(q.topic||'General'),sub=String(q.subtopic||q.sub||q.question_type||'');if(!sub&&tp.indexOf(':')>0){sub=tp.slice(tp.indexOf(':')+1).trim();tp=tp.slice(0,tp.indexOf(':')).trim()}
      questions.push({id:'q'+questions.length,sec:si,type,topic:tp,sub,difficulty:['easy','medium','hard'].includes(d)?d:'medium',
        passage:String(passage||''),text:String(text),options:type==='mcq'?opts:null,ai,
        answer:type==='mcq'?null:(Array.isArray(ans)?ans.map(String):[String(ans)]),
        marks:q.marks!=null?+q.marks:3,neg:q.negative!=null?Math.abs(+q.negative):(q.negative_marks!=null?Math.abs(+q.negative_marks):(type==='mcq'?1:0)),
        solution:String(q.solution||q.explanation||'')});
    });
  });
  if(errs.length)throw new Error(errs.slice(0,6).join('\n')+(errs.length>6?'\n…and '+(errs.length-6)+' more':''));
  if(!questions.length)throw new Error('The paper has no questions.');
  return {id:uid('p_'),kind:'paper',title:String(raw.title||'Untitled paper'),created:Date.now(),sections:sections.filter(s=>s.count>0),questions};
}
function numEq(a,b){const x=parseFloat(a),y=parseFloat(b);return !isNaN(x)&&!isNaN(y)&&/^[\s\-+.\d]+$/.test(a)&&/^[\s\-+.\d]+$/.test(b)?Math.abs(x-y)<1e-6:String(a).trim().toLowerCase()===String(b).trim().toLowerCase()}
function isCorrect(q,given){
  if(given==null||given==='')return false;
  return q.type==='mcq'?given===q.ai:q.answer.some(a=>numEq(given,a));
}
const correctText=q=>q.type==='mcq'?String.fromCharCode(65+q.ai)+'. '+q.options[q.ai]:q.answer.join(' / ');
const paperMax=p=>p.questions.reduce((s,q)=>s+q.marks,0);

/* ---------- categories: full syllabus, sectional, topic-wise ---------- */
const AREAS=['VARC','DILR','QA'],AREA_LABEL={VARC:'VA / RC',DILR:'DILR',QA:'Quant'};
const CATS={full:{name:'Full syllabus mock',desc:'Complete CAT papers with all three sections, timed like the real exam.',tint:'--accent-soft'},
  sectional:{name:'Sectional mock',desc:'One section at a time, with its own 40 minute clock.',tint:'--good-soft'},
  topic:{name:'Topic-wise mock',desc:'Short drills on one area: VA / RC, DILR or Quant.',tint:'--mark-soft'}};
function areaOfName(n){n=String(n||'');
  if(/varc|verbal|reading|\brc\b|\bva\b/i.test(n))return'VARC';
  if(/dilr|lrdi|data|logic|interpret/i.test(n))return'DILR';
  if(/quant|\bqa\b|arithmetic|algebra|geometry/i.test(n))return'QA';return''}
function topicArea(t){t=String(t||'');
  if(/comprehension|jumble|summar|odd sentence|completion|vocab|grammar|inference|passage/i.test(t))return'VARC';
  if(/table|graph|chart|arrangement|seating|puzzle|caselet|venn|network|schedul|tournament|games|bar |pie|set\b/i.test(t))return'DILR';
  if(/algebra|geometry|arith|number|percent|ratio|profit|time|speed|work|mixture|permut|probab|progress|logarithm|equation|mensur|trigon|interest|average|inequal|function|quadratic|partnership|simple|compound|combinat/i.test(t))return'QA';return''}
function paperArea(p){
  if(p.area)return p.area;
  const cnt={};
  p.questions.forEach(q=>{
    let a='';
    if(!p.derived)a=areaOfName(p.sections[q.sec]&&p.sections[q.sec].name);
    else if(q.srcKey){const k=String(q.srcKey).split(':'),sp=store.papers.find(x=>x.id===k[0]),sq=sp&&sp.questions.find(x=>x.id===k[1]);if(sq&&sp.sections[sq.sec])a=areaOfName(sp.sections[sq.sec].name)}
    a=a||areaOfName(q.topic)||topicArea(q.topic);if(a)cnt[a]=(cnt[a]||0)+1;
  });
  let best='',m=0;for(const k in cnt)if(cnt[k]>m){m=cnt[k];best=k}return best;
}
function paperCat(p){
  if(p.cat)return p.cat;
  if(p.derived)return p.srcSec!=null?'sectional':'topic';
  return p.sections.length>1?'full':'sectional';
}
const attPaper=a=>store.papers.find(x=>x.id===a.paperId);
function attCat(a){const p=attPaper(a);return p?paperCat(p):((a.secs&&a.secs.length>1)?'full':'sectional')}
function attArea(a){const p=attPaper(a);return p?paperArea(p):(areaOfName(a.qs[0]&&a.qs[0].secName)||'')}
function attPct(a,area){
  const c=attCat(a);let qs;
  if(c==='full'){
    const named=a.qs.some(x=>areaOfName(x.secName));
    qs=a.qs.filter(q=>(areaOfName(q.secName)||(!named&&a.secs&&a.secs.length===3?AREAS[q.sec]:''))===area);
  }else qs=attArea(a)===area?a.qs:[];
  if(!qs.length)return null;
  const max=qs.reduce((s,q)=>s+(q.marks||0),0);if(!max)return null;
  const got=qs.reduce((s,q)=>s+(typeof q.got==='number'?q.got:0),0);
  const att=qs.filter(q=>q.status==='correct'||q.status==='wrong').length,cor=qs.filter(q=>q.status==='correct').length;
  return {d:a.date,pct:got/max*100,acc:att?cor/att*100:0,n:qs.length,id:a.id,title:a.title};
}
function subjectPoints(area,cats,atts){return (atts||store.attempts).filter(a=>cats.includes(attCat(a))).map(a=>attPct(a,area)).filter(Boolean).sort((x,y)=>x.d-y.d)}
function subjectSvg(pts,label){
  if(!pts.length)return '<div class="sub" style="padding:22px 0">No attempts yet</div>';
  const W=340,H=130,L=30,R=12,T=14,B=22,p=pts.slice(-10);
  const X=i=>p.length===1?L+(W-L-R)/2:L+(W-L-R)*i/(p.length-1),Y=v=>T+(H-T-B)*(1-Math.max(0,Math.min(100,v))/100);
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(label||'Score')} trend, latest ${Math.round(p[p.length-1].pct)} percent">${[0,50,100].map(v=>`<line x1="${L}" x2="${W-R}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)"/><text class="v" x="${L-5}" y="${Y(v)+4}" text-anchor="end">${v}</text>`).join('')}
   ${p.length>1?`<polyline points="${p.map((x,i)=>X(i)+','+Y(x.pct)).join(' ')}" fill="none" stroke="var(--accent)" stroke-width="2.2" stroke-linejoin="round"/>`:''}
   ${p.map((x,i)=>`<circle cx="${X(i)}" cy="${Y(x.pct)}" r="${i===p.length-1?5:3.2}" fill="var(--accent)"><title>${esc(x.title)}: ${Math.round(x.pct)}%</title></circle>`).join('')}
   <text class="v" x="${X(p.length-1)}" y="${Y(p[p.length-1].pct)-9}" text-anchor="${p.length>1?'end':'middle'}" style="fill:var(--ink);font-weight:600">${Math.round(p[p.length-1].pct)}%</text></svg>`;
}
function subjectCard(area,pts,cats){
  const last=pts[pts.length-1],avg=pts.length?pts.reduce((s,x)=>s+x.pct,0)/pts.length:0,best=pts.length?Math.max(...pts.map(x=>x.pct)):0;
  return `<div class="subj${pts.length?'':' empty'}"><div class="row" style="justify-content:space-between;align-items:baseline"><b style="font-size:15px">${AREA_LABEL[area]||area}</b>${last?`<span class="num" style="font:600 22px var(--f-mono)">${Math.round(last.pct)}%</span>`:''}</div>
   ${subjectSvg(pts,AREA_LABEL[area]||area)}
   <div class="sub" style="font-size:12px">${pts.length?`${pts.length} test${pts.length>1?'s':''} · average ${Math.round(avg)}% · best ${Math.round(best)}% · accuracy ${Math.round(last.acc)}% last time`:'Attempt a full or sectional mock to see this graph.'}</div></div>`;
}

}
function trendSvg(atts){
  const a=[...atts].reverse().slice(-12);if(a.length<2)return '';
  const W=640,H=150,L=36,R=12,T=14,B=26;const mx=Math.max(...a.map(x=>x.max));
  const X=i=>L+(W-L-R)*i/(a.length-1),Y=v=>T+(H-T-B)*(1-v/mx);
  const pts=a.map((x,i)=>X(i)+','+Y(x.score)).join(' ');
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Score trend across attempts">${[0,.5,1].map(f=>`<line x1="${L}" x2="${W-R}" y1="${Y(mx*f)}" y2="${Y(mx*f)}" stroke="var(--line)"/><text class="v" x="${L-6}" y="${Y(mx*f)+4}" text-anchor="end">${Math.round(mx*f)}</text>`).join('')}
   <polyline points="${pts}" fill="none" stroke="var(--accent)" stroke-width="2"/>${a.map((x,i)=>`<circle cx="${X(i)}" cy="${Y(x.score)}" r="${i===a.length-1?5:3}" fill="var(--accent)"/><text class="v" x="${X(i)}" y="${H-8}" text-anchor="middle">${i+1}</text>`).join('')}</svg>`;
}
async function readFiles(files){
  let ok=0,bad=[];
  files=[...files];
  const pdf=files.find(f=>/\.pdf$/i.test(f.name)||f.type==='application/pdf');
  if(pdf)return importFiles([pdf]);

  V.msg=bad.length?{t:'err',m:bad.join('\n\n')}:{t:'ok',m:ok+' paper'+(ok>1?'s':'')+' added.'};renderHome();
}

/* ---------- exam engine ---------- */
let X=null,tickH=null,tickN=0;
const secQ=si=>X.paper.questions.map((q,i)=>q.sec===si?i:-1).filter(i=>i>=0);
function newState(p,mode){
  return {paperId:p.id,title:p.title,mode,secIdx:0,cur:0,left:p.sections.map(s=>s.minutes*60),total:p.sections.reduce((s,x)=>s+x.minutes*60,0),
    used:p.sections.map(()=>0),qs:p.questions.map(()=>({v:0,ans:null,mk:false,t:0,visits:0,ch:0,first:null})),done:p.sections.map(()=>false),started:Date.now(),pend:undefined,modal:null,last:Date.now()};
}
function startExam(p,mode,restored,opts){
  X=restored||newState(p,mode);X.paper=p;if(opts){X.untimed=!!opts.untimed;X.instant=!!opts.instant}if(!X.rev)X.rev={};if(X.elapsed==null)X.elapsed=0;X.last=Date.now();X.modal=X.modal&&X.modal.type==='timeup'?null:X.modal;
  if(!restored){X.qs[0].v=1;X.qs[0].visits=1}
  clearInterval(tickH);tickH=setInterval(tick,1000);
  go('exam');
}
function saveSession(){if(!X)return;const {paper,...rest}=X;LS.set('cmd.session',rest)}
function tick(){
  if(!X||V.view!=='exam')return;
  const now=Date.now(),dt=(now-X.last)/1000;X.last=now;
  if(X.modal&&X.modal.type==='timeup')return;
  X.qs[X.cur].t+=dt;X.used[X.secIdx]+=dt;
  if(X.untimed){X.elapsed+=dt}
  else if(X.mode==='cat'){X.left[X.secIdx]-=dt;if(X.left[X.secIdx]<=0){secOver(true);return}}
  else{X.total-=dt;if(X.total<=0){submitExam();return}}
  paintTimer();if(++tickN%5===0)saveSession();
}
function curLeft(){return X.untimed?X.elapsed:(X.mode==='cat'?X.left[X.secIdx]:X.total)}
function paintTimer(){const e=document.getElementById('tm');if(!e)return;const v=curLeft();e.textContent=fmtT(v);e.classList.toggle('low',!X.untimed&&v<=300)}
function secOver(auto){
  const last=X.secIdx>=X.paper.sections.length-1;
  X.done[X.secIdx]=true;
  if(last){submitExam();return}
  const prev=X.paper.sections[X.secIdx].name;
  X.secIdx++;const f=secQ(X.secIdx)[0];X.pend=undefined;gotoQ(f,true);
  X.modal=auto?{type:'timeup',name:prev}:null;render();saveSession();
}
function gotoQ(i,force){

  X.cur=i;X.pend=undefined;const s=X.qs[i];s.v=1;s.visits++;
}
function status(i){const s=X.qs[i];if(!s.v)return 'none';if(s.mk&&s.ans!=null)return 'mkans';if(s.mk)return 'mk';return s.ans!=null?'ans':'na'}
function commit(){
  const s=X.qs[X.cur];
  if(X.pend!==undefined){
    const v=X.pend===''?null:X.pend;
    if(v!=null){if(s.ans!=null&&s.ans!==v)s.ch++;if(s.first==null)s.first=v}
    s.ans=v;
  }
  X.pend=undefined;
}
function nextQ(){
  const ids=X.mode==='cat'?secQ(X.secIdx):X.paper.questions.map((q,i)=>i);
  const k=ids.indexOf(X.cur);if(k>=0&&k<ids.length-1){gotoQ(ids[k+1]);if(X.mode==='free')X.secIdx=X.paper.questions[X.cur].sec}
  renderExam();saveSession();
}
function prevQ(){
  const ids=X.mode==='cat'?secQ(X.secIdx):X.paper.questions.map((q,i)=>i);
  const k=ids.indexOf(X.cur);if(k>0){gotoQ(ids[k-1]);if(X.mode==='free')X.secIdx=X.paper.questions[X.cur].sec}
  renderExam();
}
function counts(ids){
  const c={ans:0,na:0,mk:0,mkans:0,none:0};ids.forEach(i=>c[status(i)]++);return c;
}

/* ---------- exam rendering ---------- */
function renderExam(){

  }
  app.innerHTML=`<div class="exam">
   <div class="xhead"><div class="ttl">${esc(X.title)}</div><div class="row">${window.Capacitor?'':`<button class="btn sm" data-act="fullscreen" id="fsx">${document.fullscreenElement?'Exit full screen':'Full screen'}</button>`}<button class="btn sm" data-act="calctoggle" aria-pressed="${CALC.open}">Calculator</button><span style="font-size:13px;opacity:.85">${X.untimed?'Time elapsed':(X.mode==='cat'?'Section time left':'Time left')}</span><span class="timer" id="tm">${fmtT(curLeft())}</span></div></div>

   <div class="xmain">
    <div class="xq">
     <div class="xqhead"><span>Question ${n} of ${secQ(q.sec).length} · ${esc(secName)}</span><span class="mk">${q.type==='mcq'?'Single choice':'Type in the answer'} · Marks <b>+${q.marks}</b> ${q.neg?`<i>−${q.neg}</i>`:'· no negative'}</span></div>

     <div class="who"><div class="avatar">${esc((candName()||'C').trim().charAt(0).toUpperCase())}</div><div><div style="font-weight:600">${esc(candName()||'Candidate')}</div><div class="sub" style="font-size:12px">${esc(secName)}</div></div></div>
     <div class="legend">
      <div><span class="pb">${c.none}</span>Not visited</div><div><span class="pb na">${c.na}</span>Not answered</div>
      <div><span class="pb ans">${c.ans}</span>Answered</div><div><span class="pb mk">${c.mk}</span>Marked</div>
      <div style="grid-column:span 2"><span class="pb mkans">${c.mkans}</span>Answered &amp; marked for review</div></div>
     <div class="palhead">${X.mode==='cat'?esc(secName):'All sections'}</div>
     <div class="pal">${ids.map(i=>`<button class="pb ${status(i)} ${i===X.cur?'cur':''}" data-act="goq" data-i="${i}" aria-label="Question ${i+1}">${X.mode==='cat'?secQ(p.questions[i].sec).indexOf(i)+1:i+1}</button>`).join('')}</div>
     <div class="xsubmit">${X.mode==='cat'&&X.secIdx<p.sections.length-1?`<button class="btn" style="width:100%" data-act="subsec">Submit section</button>`:`<button class="btn pri" style="width:100%" data-act="subtest">Submit test</button>`}</div>
    </aside>
   </div>
   <div class="xact"><button class="btn mrk" data-act="markn">Mark for Review &amp; Next</button>${X.instant&&!rv?'<button class="btn" data-act="check">Check answer</button>':''}<button class="btn" data-act="clear">Clear Response</button><button class="btn" data-act="prev">Previous</button><span class="sp"></span><button class="btn sv" data-act="savn">Save &amp; Next</button></div>

function fbHtml(q,s){

/* ---------- submit + attempt record ---------- */
function submitExam(){
  clearInterval(tickH);tickH=null;
  const p=X.paper;
  const qs=p.questions.map((q,i)=>{
    const s=X.qs[i];let st=!s.v?'unseen':(s.ans==null?'skipped':(isCorrect(q,s.ans)?'correct':'wrong'));

    return {id:q.id,n:i+1,sec:q.sec,secName:p.sections[q.sec].name,type:q.type,topic:q.topic,sub:q.sub||'',difficulty:q.difficulty,status:st,given:s.ans,marks:q.marks,neg:q.neg,got,time:Math.round(s.t),visits:s.visits,ch:s.ch,mk:s.mk,first:s.first,firstOk:s.first==null?null:isCorrect(q,s.first)};
  });
  const score=qs.reduce((a,x)=>a+x.got,0),correct=qs.filter(x=>x.status==='correct').length,wrong=qs.filter(x=>x.status==='wrong').length;
  const att={id:uid('a_'),kind:'attempt',paperId:p.id,title:p.title,date:Date.now(),mode:X.untimed?'untimed':X.mode,qs,tags:{},
    secs:p.sections.map((s,i)=>({name:s.name,minutes:s.minutes,used:Math.round(X.used[i])})),
    score,max:paperMax(p),correct,wrong,attempted:correct+wrong,accuracy:pct(correct,correct+wrong)};

<script>
'use strict';
const ST={correct:'var(--good)',wrong:'var(--bad)',skipped:'var(--warn)',unseen:'var(--none)'};
const REASONS=['Concept gap','Calculation slip','Misread question','Time pressure','Guessed','Skipped on purpose'];
function agg(list){
  const o={n:list.length,correct:0,wrong:0,skipped:0,unseen:0,score:0,max:0,time:0,neg:0};
  list.forEach(x=>{o[x.status]++;o.score+=x.got;o.max+=x.marks;o.time+=x.time;if(x.status==='wrong')o.neg+=x.neg});
  o.attempted=o.correct+o.wrong;o.acc=pct(o.correct,o.attempted);return o;
}
function groupBy(list,key){const g={};list.forEach(x=>{(g[x[key]]=g[x[key]]||[]).push(x)});return g}
function idealOf(A,x){const sc=A.secs[x.sec];const cnt=A.qs.filter(y=>y.sec===x.sec).length;return sc.minutes*60/cnt}
function buildInsights(A){
  const out=[],qs=A.qs,T=agg(qs);
  const add=(cls,title,text)=>out.push({cls,title,text});
  const mcq=agg(qs.filter(q=>q.type==='mcq'));
  if(T.wrong){
    add(T.neg>=T.score*0.2?'bad':'warn','Negative marking cost you '+r1(T.neg)+' marks','You answered '+T.wrong+' question'+(T.wrong>1?'s':'')+' wrongly. That is '+pct(T.neg,T.score+T.neg)+'% of the marks you earned before penalties. MCQ accuracy was '+mcq.acc+'%'+(mcq.attempted&&mcq.acc<75?', below the 75% level where attempting stays comfortably profitable at +3/−1.':'.'));
  }else if(T.attempted){add('good','No wrong answers','Every question you attempted was correct. Check below whether you left marks unattempted.')}
  const sinks=A.noTime?[]:qs.filter(x=>(x.status==='wrong'||x.status==='skipped')&&x.time>1.75*idealOf(A,x)&&x.visits>0);
  if(sinks.length){
    const lost=sinks.reduce((a,x)=>a+x.time,0);const avgIdeal=qs.reduce((a,x)=>a+idealOf(A,x),0)/qs.length;
    add('bad','Time sinks: '+fmtMin(lost)+' on '+sinks.length+' question'+(sinks.length>1?'s':'')+' that gave no marks',
      'Questions '+sinks.slice(0,8).map(x=>x.secName+' '+x.n).join(', ')+' each took far longer than their share of time and ended wrong or blank. That time would have covered about '+Math.floor(lost/avgIdeal)+' average questions. Set a hard cut-off and leave early.');
  }
  const hasty=A.noTime?[]:qs.filter(x=>x.status==='wrong'&&x.time<0.4*idealOf(A,x));
  if(hasty.length)add('warn',hasty.length+' wrong answer'+(hasty.length>1?'s':'')+' came in under 40% of the average time','Questions '+hasty.slice(0,8).map(x=>x.n).join(', ')+' were answered fast and wrong. These look like misreads or careless picks; re-read the stem and options before saving.');
  const slowOk=A.noTime?[]:qs.filter(x=>x.status==='correct'&&x.time>2*idealOf(A,x));
  if(slowOk.length)add('warn',slowOk.length+' correct answer'+(slowOk.length>1?'s':'')+' took over twice the average time','Questions '+slowOk.slice(0,8).map(x=>x.n).join(', ')+'. They scored, but at a high time cost. Review the faster method in the solutions.');
  const unseen=qs.filter(x=>x.status==='unseen');
  if(unseen.length)add('bad',unseen.length+' question'+(unseen.length>1?'s were':' was')+' never opened','Questions '+unseen.slice(0,10).map(x=>x.secName+' '+x.n).join(', ')+'. Spend the first two minutes of each section scanning for easy questions so none are lost unseen.');
  const skipped=qs.filter(x=>x.status==='skipped');
  if(skipped.length)add('warn',skipped.length+' question'+(skipped.length>1?'s were':' was')+' opened and left blank','Check the solutions: if several were easy or medium, they were reachable with more time on those instead of the time sinks.');
  const flip=qs.filter(x=>x.ch>0&&x.firstOk===true&&x.status==='wrong');
  const flipUp=qs.filter(x=>x.ch>0&&x.firstOk===false&&x.status==='correct');
  if(flip.length)add('bad','You changed a correct answer to a wrong one '+flip.length+' time'+(flip.length>1?'s':''),'Questions '+flip.map(x=>x.n).join(', ')+'. Your first instinct was right there. Change an answer only when you can name the specific error.');
  if(flipUp.length)add('good','Second thoughts paid off '+flipUp.length+' time'+(flipUp.length>1?'s':''),'Questions '+flipUp.map(x=>x.n).join(', ')+' went from wrong to correct after you revisited them.');
  const tg=groupBy(qs,'topic'),tl=Object.keys(tg).map(k=>({k,...agg(tg[k])})).filter(x=>x.n>=2&&x.attempted>0);
  const weak=tl.filter(x=>x.acc<60).sort((a,b)=>a.acc-b.acc).slice(0,3);
  if(weak.length)add('bad','Weakest topics: '+weak.map(x=>x.k).join(', '),weak.map(x=>x.k+' '+x.acc+'% ('+x.correct+'/'+x.attempted+')').join(' · ')+'. Practise these first.');
  const strong=tl.filter(x=>x.acc>=80).sort((a,b)=>b.acc-a.acc).slice(0,3);
  if(strong.length)add('good','Strong topics: '+strong.map(x=>x.k).join(', '),'Accuracy of '+strong.map(x=>x.acc+'%').join(', ')+'. Keep these quick and use the saved time elsewhere.');
  const easyMiss=qs.filter(x=>x.difficulty==='easy'&&x.status!=='correct');
  if(easyMiss.length)add('bad',easyMiss.length+' easy question'+(easyMiss.length>1?'s':'')+' not converted','Questions '+easyMiss.map(x=>x.secName+' '+x.n).slice(0,8).join(', ')+'. Easy questions are the marks that separate percentiles most.');
  const mk=qs.filter(x=>x.mk&&x.status!=='unseen');
  if(mk.length){const ok=mk.filter(x=>x.status==='correct').length;add('info','Marked for review: '+ok+' of '+mk.length+' correct','Marking works for you when the revisit turns into marks. '+(ok/mk.length<0.4?'Most marked questions stayed wrong or blank, so consider skipping outright instead of marking.':'Keep using it.'));}
  (A.noTime?[]:A.secs).forEach(s=>{const left=s.minutes*60-s.used;if(A.mode==='cat'&&left>s.minutes*60*0.15)add('info',s.name+': finished with '+fmtMin(left)+' unused','Either the section was cleared early or you left it with time in hand. Use leftover time to revisit marked questions.')});
  return out;
}
function outcomeBar(a){const t=a.n||1;return `<div class="bar" title="${a.correct} correct, ${a.wrong} wrong, ${a.skipped} blank, ${a.unseen} unseen"><i style="width:${a.correct/t*100}%;background:var(--good)"></i><i style="width:${a.wrong/t*100}%;background:var(--bad)"></i><i style="width:${a.skipped/t*100}%;background:var(--warn)"></i><i style="width:${a.unseen/t*100}%;background:var(--none)"></i></div>`}
function legendRow(){return `<div class="chips" style="margin-bottom:8px">${[['correct','Correct'],['wrong','Wrong'],['skipped','Blank'],['unseen','Unseen']].map(([k,l])=>`<span class="chip"><span style="display:inline-block;width:9px;height:9px;border-radius:2px;background:${ST[k]};margin-right:5px"></span>${l}</span>`).join('')}</div>`}
function timeChart(A){
  const qs=A.qs,n=qs.length,W=720,H=222,L=40,R=8,T=26,B=26;
  const ideals=qs.map(x=>idealOf(A,x));
  const mx=Math.max(60,...qs.map(x=>x.time),...ideals.map(v=>v*1.6));
  const step=mx>600?120:mx>300?60:30;const top=Math.ceil(mx/step)*step;
  const bw=(W-L-R)/n,Y=v=>T+(H-T-B)*(1-v/top);
  let g='';
  for(let v=0;v<=top;v+=step)g+=`<line x1="${L}" x2="${W-R}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)"/><text class="v" x="${L-6}" y="${Y(v)+4}" text-anchor="end">${v>=60?Math.round(v/60)+'m'+(v%60?v%60:''):v+'s'}</text>`;
  qs.forEach((x,i)=>{const h=Math.max(1,(H-T-B)*x.time/top);g+=`<g class="tbar" data-act="qopen" data-q="${esc(x.id)}"><title>${esc(x.secName)} Q${x.n}: ${fmtT(x.time)} · ${x.status==='skipped'?'blank':x.status} (click to open)</title><rect x="${L+i*bw}" y="${T}" width="${bw}" height="${H-T-B}" fill="transparent"/><rect class="bb" x="${L+i*bw+bw*0.15}" y="${H-B-h}" width="${bw*0.7}" height="${h}" fill="${ST[x.status]}"/></g>`;
    if(n<=32||i%5===4||i===0)g+=`<text class="v" x="${L+i*bw+bw/2}" y="${H-9}" text-anchor="middle">${x.n}</text>`});
  A.secs.forEach((s,si)=>{const idx=qs.map((x,i)=>x.sec===si?i:-1).filter(i=>i>=0);if(!idx.length)return;const x1=L+idx[0]*bw,x2=L+(idx[idx.length-1]+1)*bw,id=s.minutes*60/idx.length;
    g+=`<line x1="${x1}" x2="${x2}" y1="${Y(id)}" y2="${Y(id)}" stroke="var(--ink)" stroke-width="1.2" stroke-dasharray="4 3"/>`;
    if(si>0)g+=`<line x1="${x1}" x2="${x1}" y1="${T}" y2="${H-B}" stroke="var(--ink2)" stroke-width="1"/>`;
    g+=`<text x="${x1+4}" y="${T-10}" font-weight="600">${esc(s.name)}</text>`});
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Time spent on each question">${g}</svg>`;
}
function scOf(list){const u=[...new Set(list.map(x=>x.secName))];return u.length===1?u[0]:''}
function groupRows(list,key,order){
  const g=groupBy(list,key);const keys=order||Object.keys(g).sort((a,b)=>agg(g[a]).acc-agg(g[b]).acc);
  return `<div class="tablewrap"><table class="hist"><thead><tr><th>${key==='topic'?'Topic':key==='type'?'Type':key==='secName'?'Section':'Level'}</th><th>Qs</th><th>Accuracy</th><th>Outcome</th><th>Marks</th><th>Avg time</th></tr></thead><tbody>${keys.filter(k=>g[k]).map(k=>{const a=agg(g[k]);return `<tr class="toprow" data-act="grp" data-gk="${key}" data-gv="${esc(k)}" data-sc="${esc(scOf(list))}" title="Click to see these questions"><td>${esc(key==='type'?k.toUpperCase():k)} <span class="tcaret">›</span></td><td class="num">${a.n}</td><td class="num ${a.attempted?(a.acc>=75?'good':a.acc<50?'bad':'warn'):''}">${a.attempted?a.acc+'%':'–'}</td><td style="min-width:110px">${outcomeBar(a)}</td><td class="num">${r1(a.score)}/${a.max}</td><td class="num">${fmtT(a.time/a.n)}</td></tr>`}).join('')}</tbody></table></div>`;
}

     <div class="panel" style="margin-top:16px"><h3>Average time per question (m:ss)</h3><div class="tablewrap"><table class="hist"><thead><tr><th>Section</th><th>Available</th><th>Correct</th><th>Wrong</th><th>Blank / unseen</th><th>Total spent</th></tr></thead><tbody>${rows}</tbody></table></div>

<script>

const VERDICT=a=>!a.attempted?['Not attempted','unseen']:a.acc>=80?['Strong','correct']:a.acc>=60?['Fair','skipped']:['Weak','wrong'];
const lostOf=l=>{const a=agg(l);return a.max-a.score};
function aggRow(label,l,o){
  const a=agg(l),v=VERDICT(a),lost=a.max-a.score;
  const open=o.key&&V.topicOpen&&V.topicOpen.has(o.key);
  return `<tr class="${o.sub?'subrow':''}${o.key?' toprow':''}"${o.key?` data-act="topicopen" data-k="${esc(o.key)}" title="Click to see the questions"`:''}><td style="${o.sub?'padding-left:28px;color:var(--ink2)':'font-weight:600'}">${o.key?`<span class="tcaret">${open?'▾':'▸'}</span>`:''}${esc(label)}</td>${o.sec!=null?`<td>${esc(o.sec)}</td>`:''}<td class="num">${a.n}</td><td class="num ${a.attempted?(a.acc>=75?'good':a.acc<50?'bad':'warn'):''}">${a.attempted?a.acc+'%':'–'}</td><td style="min-width:110px">${outcomeBar(a)}</td><td class="num">${r1(a.score)}/${a.max}</td><td class="num ${lost>0?'bad':''}">${lost>0?'−'+r1(lost):'0'}</td><td class="num">${fmtT(a.time/a.n)}</td><td><span class="pill ${v[1]}">${v[0]}</span></td></tr>`;
}
function topicTable(list,showSec){
  const g=groupBy(list,'topic'),keys=Object.keys(g).sort((a,b)=>lostOf(g[b])-lostOf(g[a]));let rows='';
  const AA=store.attempts.find(x=>x.id===V.analysisId),cols=showSec?9:8,tq=(key,t,sb)=>(AA&&V.topicOpen&&V.topicOpen.has(key))?`<tr class="tqrow"><td colspan="${cols}">${topicQuestionsHtml(AA,t,sb)}</td></tr>`:'';
  keys.forEach(k=>{const l=g[k];rows+=aggRow(k,l,{key:k,sec:showSec?[...new Set(l.map(x=>x.secName))].join(', '):null})+tq(k,k,'');
    const subs=groupBy(l.filter(x=>x.sub),'sub'),sk=Object.keys(subs).sort((a,b)=>lostOf(subs[b])-lostOf(subs[a]));
    sk.forEach(t=>{rows+=aggRow(t,subs[t],{sub:1,key:k+'›'+t,sec:showSec?'':null})+tq(k+'›'+t,k,t)})});
  return `<div class="tablewrap"><table class="hist"><thead><tr><th>Topic</th>${showSec?'<th>Section</th>':''}<th>Qs</th><th>Accuracy</th><th>Outcome</th><th>Marks</th><th>Lost</th><th>Avg time</th><th>Verdict</th></tr></thead><tbody>${rows}</tbody></table></div><div class="sub" style="font-size:12px;margin-top:6px">Sorted by marks lost, biggest first. Lost counts negatives and every question not answered correctly.</div>`;
}
function qStrip(list){return `<div class="strip">${list.map(x=>`<span class="qb ${x.status}" data-act="qopen" data-q="${esc(x.id)}" style="background:${ST[x.status]}" title="Click to open · Q${x.n} · ${esc(x.topic)}${x.sub?' › '+esc(x.sub):''} · ${fmtT(x.time)} · ${x.status}">${x.n}</span>`).join('')}</div>`}
function lossChart(list){
  const g=groupBy(list,'topic'),rows=Object.keys(g).map(k=>({k,v:lostOf(g[k])})).filter(r=>r.v>0).sort((a,b)=>b.v-a.v).slice(0,10);
  if(!rows.length)return '<p class="sub">No marks lost here.</p>';
  const W=640,L=210,R=44,rh=26,H=rows.length*rh+8,mx=rows[0].v,sc=scOf(list);
  return `<div style="max-width:720px;text-align:right"><button class="btn sm" data-zoomchart="1">Zoom graph</button></div><svg class="chart" style="max-width:720px" viewBox="0 0 ${W} ${H}" role="img" aria-label="Marks lost by topic">${rows.map((r,i)=>{const y=i*rh+4,w=(W-L-R)*r.v/mx;return `<g class="gbar" data-act="grptopic" data-t="${esc(r.k)}" data-sc="${esc(sc)}" style="cursor:pointer"><title>${esc(r.k)}: click to see these questions</title><rect x="0" y="${y}" width="${W}" height="${rh}" fill="transparent"/><text x="${L-8}" y="${y+15}" text-anchor="end">${esc(r.k.length>30?r.k.slice(0,29)+'…':r.k)}</text><rect class="bb" x="${L}" y="${y+3}" width="${w}" height="16" fill="var(--bad)" opacity=".85"/><text class="v" x="${L+w+6}" y="${y+15}">${r1(r.v)}</text></g>`}).join('')}</svg>`;
}
function sectionsTab(A){
  return A.secs.map((s,i)=>{
    const l=A.qs.filter(x=>x.sec===i),a=agg(l),ideal=s.minutes*60/l.length;
    const tg=groupBy(l,'topic'),tl=Object.keys(tg).map(k=>({k,...agg(tg[k])})).filter(x=>x.attempted>0);
    const pool=tl.filter(x=>x.attempted>=2).length>=2?tl.filter(x=>x.attempted>=2):tl;
    const best=[...pool].sort((x,y)=>y.acc-x.acc||y.attempted-x.attempted)[0],worst=[...pool].sort((x,y)=>x.acc-y.acc||y.attempted-x.attempted)[0];
    const sinks=l.filter(x=>x.status!=='correct'&&x.time>1.75*ideal).length;
    const notes=[];
    const tn=(cls,pre,t)=>notes.push({cls,title:pre+t.k,text:t.acc+'% accuracy: '+t.correct+' of '+t.attempted+' attempted correct, out of '+t.n+' question'+(t.n>1?'s':'')+' in this section. Click to see them.',k:t.k});
    if(best&&worst&&best.k!==worst.k&&best.acc!==worst.acc){tn('good','Strongest topic: ',best);tn('bad','Weakest topic: ',worst)}
    if(!A.noTime)notes.push({cls:'',title:'Time per question',text:'Average '+fmtT(a.time/a.n)+' spent against '+fmtT(ideal)+' available.'});
    if(sinks)notes.push({cls:'warn',title:sinks+' time sink'+(sinks>1?'s':''),text:sinks+' question'+(sinks>1?'s':'')+' took far longer than average and gave no marks.'});
    if(a.unseen)notes.push({cls:'warn',title:a.unseen+' never opened',text:a.unseen+' question'+(a.unseen>1?'s were':' was')+' not opened at all.'});
    return `<div class="panel" style="margin-bottom:16px"><div class="row" style="justify-content:space-between;align-items:flex-start"><h2>${esc(s.name)}</h2><div class="chips"><span class="chip">${r1(a.score)}/${a.max} marks</span><span class="chip">${a.attempted?a.acc+'% accuracy':'no attempts'}</span><span class="chip">${a.attempted}/${a.n} attempted</span><span class="chip">${A.noTime?s.minutes+' min section':fmtT(s.used)+' of '+s.minutes+' min'}</span>${a.neg?`<span class="chip">−${r1(a.neg)} negative</span>`:''}</div></div>
     ${legendRow()}${qStrip(l)}
     <ul class="ins" style="margin:6px 0 14px">${notes.map(n=>`<li class="${n.cls}"${n.k?` data-act="grptopic" data-t="${esc(n.k)}" data-sc="${esc(s.name)}"`:''}><b>${esc(n.title)}</b>${esc(n.text)}</li>`).join('')}</ul>
     <h3>Topics and question types in ${esc(s.name)}</h3>${topicTable(l,false)}
     <div class="charts" style="margin-top:16px"><div><h3>By difficulty</h3>${groupRows(l,'difficulty',['easy','medium','hard'])}</div><div><h3>By answer format</h3>${groupRows(l,'type',['mcq','tita'])}</div></div></div>`;
  }).join('');
}
function topicsTab(A){
  const SF=V.tsec||'all',l=SF==='all'?A.qs:A.qs.filter(x=>x.secName===SF);
  return `<div class="panel"><div class="chips">${['all',...A.secs.map(s=>s.name)].map(k=>`<button class="chip ${SF===k?'on':''}" data-act="tsec" data-f="${esc(k)}">${k==='all'?'All sections':esc(k)}</button>`).join('')}</div></div>
   <div class="panel" style="margin-top:16px"><h3>Where the marks went (by topic)</h3>${lossChart(l)}</div>
   <div class="panel" style="margin-top:16px"><h3>Topic and question-type breakdown</h3>${topicTable(l,SF==='all')}</div>
   <div class="charts" style="margin-top:16px"><div class="panel"><h3>By difficulty</h3>${groupRows(l,'difficulty',['easy','medium','hard'])}</div><div class="panel"><h3>By answer format</h3>${groupRows(l,'type',['mcq','tita'])}</div></div>`;
}
function revList(A,P,list){
  if(!list.length)return '<p class="sub">No questions match this filter.</p>';

  return h;
}

/* ---------- on-screen calculator ---------- */
const CALC={open:false,expr:'',res:'',mem:0,x:null,y:null,eq:false};
const cshow=s=>s.replace(/\*/g,'×').replace(/\//g,'÷').replace(/pi/g,'π').replace(/sqrt/g,'√');
function calcEval(s){
  const t=[],re=/\s*(\d+\.?\d*|\.\d+|sqrt|sin|cos|tan|log|ln|pi|[-+*\/^()%])/y;let m,i=0;
  while(i<s.length){re.lastIndex=i;m=re.exec(s);if(!m)throw 0;t.push(m[1]);i=re.lastIndex}
  let p=0;const peek=()=>t[p],nx=()=>t[p++],D=Math.PI/180;
  const expr=()=>{let v=term();while(peek()==='+'||peek()==='-'){const o=nx(),r=term();v=o==='+'?v+r:v-r}return v};
  const term=()=>{let v=un();while(peek()==='*'||peek()==='/'){const o=nx(),r=un();v=o==='*'?v*r:v/r}return v};
  const un=()=>{if(peek()==='-'){nx();return -un()}if(peek()==='+'){nx();return un()}return pw()};
  const pw=()=>{const b=post();if(peek()==='^'){nx();return Math.pow(b,un())}return b};
  const post=()=>{let v=prim();while(peek()==='%'){nx();v/=100}return v};
  const prim=()=>{const x=nx();if(x===undefined)throw 0;
    if(/^[\d.]/.test(x))return parseFloat(x);
    if(x==='('){const v=expr();if(peek()===')')nx();return v}
    if(x==='pi')return Math.PI;
    const f={sqrt:Math.sqrt,sin:v=>Math.sin(v*D),cos:v=>Math.cos(v*D),tan:v=>Math.tan(v*D),log:Math.log10,ln:Math.log}[x];
    if(!f||peek()!=='(')throw 0;nx();const v=expr();if(peek()===')')nx();return f(v)};
  const v=expr();if(p<t.length)throw 0;return v;
}
const cfmt=v=>!isFinite(v)?'Error':String(parseFloat(v.toPrecision(12)));
function calcLive(){try{CALC.res=CALC.expr?cfmt(calcEval(CALC.expr)):''}catch(e){CALC.res=''}}
function calcKey(k){
  const C=CALC,isNum=/^[\d.]$/.test(k),isOp=/^[-+*\/^]$/.test(k),isFn=['sin','cos','tan','log','ln','sqrt'].includes(k);
  if(C.eq){
    if(isOp&&C.res&&C.res!=='Error')C.expr=C.res;
    else if(isNum||isFn||k==='('||k==='pi'||k==='mr')C.expr='';
    C.eq=false;
  }
  if(isNum||isOp||k==='('||k===')'||k==='%')C.expr+=k;
  else if(isFn)C.expr+=k+'(';
  else if(k==='pi')C.expr+='pi';
  else if(k==='sq')C.expr+='^2';
  else if(k==='inv'){calcLive();C.expr='1/('+(C.expr||'1')+')'}
  else if(k==='neg'){C.expr=C.expr.startsWith('-(')&&C.expr.endsWith(')')?C.expr.slice(2,-1):(C.expr?'-('+C.expr+')':'')}
  else if(k==='bs')C.expr=C.expr.replace(/(sqrt\(|sin\(|cos\(|tan\(|log\(|ln\(|pi|.)$/,'');
  else if(k==='clr'){C.expr='';C.res=''}
  else if(k==='mc')C.mem=0;
  else if(k==='mr')C.expr+=String(C.mem<0?'('+C.mem+')':C.mem);
  else if(k==='mp'||k==='mm'){calcLive();const v=parseFloat(C.res);if(!isNaN(v))C.mem+=k==='mp'?v:-v}
  else if(k==='eq'){try{C.res=cfmt(calcEval(C.expr||'0'));C.eq=true}catch(e){C.res='Error'}paintCalc();return}
  calcLive();paintCalc();
}
function paintCalc(){const e=document.getElementById('calce'),r=document.getElementById('calcr'),m=document.getElementById('calcm');if(e)e.textContent=cshow(CALC.expr)||'\u00a0';if(r)r.textContent=CALC.res||'0';if(m)m.textContent=CALC.mem?'M':''}
function calcHtml(){
  const B=(k,l,c)=>`<button class="${c||''}" data-act="calckey" data-k="${k}">${l}</button>`;
  const pos=CALC.x!=null?`left:${CALC.x}px;top:${CALC.y}px;right:auto;bottom:auto`:'';
  return `<div class="calc" id="calc" style="${pos}" role="dialog" aria-label="Calculator"><div class="calc-h" id="calch"><span>Calculator <span id="calcm" style="opacity:.8;margin-left:6px">${CALC.mem?'M':''}</span></span><button class="x" data-act="calctoggle" aria-label="Close calculator">&#10005;</button></div>
   <div class="calc-d"><div class="e" id="calce">${esc(cshow(CALC.expr))||'&nbsp;'}</div><div class="r" id="calcr">${esc(CALC.res)||'0'}</div></div>
   <div class="calc-k">
    ${B('mc','MC','fn')}${B('mr','MR','fn')}${B('mp','M+','fn')}${B('mm','M−','fn')}${B('bs','&#9003;','clr')}
    ${B('sin','sin','fn')}${B('cos','cos','fn')}${B('tan','tan','fn')}${B('log','log','fn')}${B('ln','ln','fn')}
    ${B('sqrt','&radic;','op')}${B('sq','x&sup2;','op')}${B('inv','1/x','op')}${B('^','x&#696;','op')}${B('pi','&pi;','op')}
    ${B('7','7')}${B('8','8')}${B('9','9')}${B('(','(','op')}${B(')',')','op')}
    ${B('4','4')}${B('5','5')}${B('6','6')}${B('*','&times;','op')}${B('/','&divide;','op')}
    ${B('1','1')}${B('2','2')}${B('3','3')}${B('-','&minus;','op')}${B('%','%','op')}
    ${B('0','0')}${B('.','.')}${B('neg','&plusmn;','op')}${B('+','+','op')}${B('eq','=','eq')}
    <button class="clr" style="grid-column:span 5" data-act="calckey" data-k="clr">Clear</button>
   </div></div>`;
}

document.addEventListener('keydown',e=>{
  if(V.view!=='exam'||!CALC.open||e.ctrlKey||e.metaKey||e.altKey)return;
  const tag=document.activeElement&&document.activeElement.tagName;if(tag==='INPUT'||tag==='TEXTAREA'||tag==='SELECT')return;
  const k=e.key;let m=null;
  if(/^[\d.]$/.test(k)||/^[-+*\/^()%]$/.test(k))m=k;
  else if(k==='Backspace')m='bs';
  else if((k==='Enter'||k==='=')&&tag!=='BUTTON')m='eq';
  if(m){e.preventDefault();calcKey(m)}
});

renderHome();
store.init().then(()=>{if(V.view==='home')renderHome()});
</script>

<script>
'use strict';
/* ---------- AI coach ---------- */
const DESK=!!window.desk;
const AIS={provider:null,model:'',baseUrl:'',hasKey:false,loaded:false};
const AI_LABEL={gemini:'Google Gemini',anthropic:'Anthropic Claude',openai:'OpenAI-compatible endpoint',inpage:'Claude (built into this page)'};
const AI_MODEL={gemini:'gemini-3.1-pro-preview',anthropic:'claude-sonnet-5-5',openai:''};
async function aiLoad(){
  try{if(DESK)Object.assign(AIS,await window.desk.getSettings())}catch(e){}
  if(!AIS.provider)AIS.provider=DESK?'gemini':'inpage';
  AIS.loaded=true;
}
function md(t){
  const inl=x=>x.replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/`([^`]+)`/g,'<code>$1</code>');
  let h='',list=null;const close=()=>{if(list){h+='</'+list+'>';list=null}};
  for(const ln of esc(t).split('\n')){let m;
    if(m=ln.match(/^#{1,4}\s+(.*)/)){close();h+='<h4>'+inl(m[1])+'</h4>'}
    else if(m=ln.match(/^\s*[-*•]\s+(.*)/)){if(list!=='ul'){close();h+='<ul>';list='ul'}h+='<li>'+inl(m[1])+'</li>'}
    else if(m=ln.match(/^\s*\d+[.)]\s+(.*)/)){if(list!=='ol'){close();h+='<ol>';list='ol'}h+='<li>'+inl(m[1])+'</li>'}
    else if(!ln.trim())close();
    else{close();h+='<p>'+inl(ln)+'</p>'}}
  close();return h;
}
function buildAiPrompt(A,P){
  const T=agg(A.qs),L=[];
  const clip=(x,n)=>{x=String(x||'').replace(/\s+/g,' ').trim();return x.length>n?x.slice(0,n)+'…':x};
  const line=(n,a)=>`${n}: ${r1(a.score)}/${a.max} marks, accuracy ${a.attempted?a.acc+'%':'n/a'}, ${a.correct} correct, ${a.wrong} wrong, ${a.skipped} blank, ${a.unseen} unseen, avg time ${fmtT(a.time/Math.max(1,a.n))}`;
  L.push('You are an experienced CAT (Common Admission Test, India) coach. Below is the full result of one practice mock attempt. Write an in-depth, honest analysis for the student.');
  L.push('');if(A.noTime)L.push('NOTE: per-question time was not recorded for this attempt (answers were entered afterwards). Do not comment on timing.');
  L.push(`PAPER: ${A.title}. Mode: ${A.mode==='cat'?'CAT sectional timing':'single timer'}. Marking: +3 correct, -1 wrong MCQ, no negative for type-in answers.`);
  L.push(line('TOTAL',T)+`, negative marks lost ${r1(T.neg)}`);
  L.push('');L.push('SECTIONS:');
  A.secs.forEach((s,i)=>L.push('- '+line(s.name,agg(A.qs.filter(x=>x.sec===i)))+`, time used ${fmtT(s.used)} of ${s.minutes} min`));
  L.push('');L.push('TOPICS (and question types):');
  const tg=groupBy(A.qs,'topic');
  Object.keys(tg).forEach(k=>{L.push('- '+line(k,agg(tg[k])));const sg=groupBy(tg[k].filter(x=>x.sub),'sub');Object.keys(sg).forEach(u=>L.push('    - '+line(u,agg(sg[u]))))});
  L.push('');L.push('DIFFICULTY:');const dg=groupBy(A.qs,'difficulty');Object.keys(dg).forEach(k=>L.push('- '+line(k,agg(dg[k]))));
  L.push('');L.push('AUTOMATIC OBSERVATIONS:');buildInsights(A).forEach(i=>L.push('- '+i.title+'. '+i.text));
  const tags=Object.entries(A.tags||{}).filter(e=>e[1]);
  if(tags.length){L.push('');L.push('STUDENT\'S OWN MISTAKE TAGS: '+tags.map(([id,t])=>{const q=A.qs.find(x=>x.id===id);return q?`${q.secName} Q${q.n}=${t}`:''}).filter(Boolean).join('; '))}
  L.push('');L.push('EVERY QUESTION (section | number | topic > type | difficulty | result | time spent vs available | answer changes):');
  A.qs.forEach(x=>L.push(`${x.secName} | Q${x.n} | ${x.topic}${x.sub?' > '+x.sub:''} | ${x.difficulty} | ${x.status} | ${fmtT(x.time)} vs ${fmtT(idealOf(A,x))} | ${x.ch?'changed '+x.ch+'x':'-'}${x.mk?' | marked':''}`));
  const pri=A.qs.filter(x=>x.status==='wrong').concat(A.qs.filter(x=>x.status==='skipped'&&x.time>idealOf(A,x))).slice(0,14);
  if(pri.length&&P){
    L.push('');L.push('DETAIL OF THE MOST COSTLY QUESTIONS:');
    pri.forEach(x=>{const q=P.questions[x.n-1];if(!q||q.id!==x.id)return;
      const given=x.given==null?'none':(x.type==='mcq'?String.fromCharCode(65+x.given)+'. '+clip(q.options[x.given],160):String(x.given));
      L.push(`[${x.secName} Q${x.n}] ${clip(q.text,420)}`);
      L.push(`  Student answered: ${given}. Correct: ${clip(correctText(q),160)}. Official solution: ${clip(q.solution,320)}`)});
  }
  L.push('');
  L.push('WRITE THE ANALYSIS WITH THESE HEADINGS (markdown, bullets, no tables):');
  L.push('1. Overall diagnosis (3-4 sentences: what limited the score most).');
  L.push('2. Section-by-section analysis (attempt strategy, time per question targets, what to do differently).');
  L.push('3. Topic and question-type weaknesses, ranked by marks that can be recovered, each with 2-3 concrete drills.');
  L.push('4. Mistake patterns (misreads, trap options, time sinks, answer changes), citing question numbers.');
  L.push('5. Strategy changes for the next mock (order of attempt, skip rules, time cut-offs per question).');
  L.push('6. A 7-day practice plan with daily tasks and time estimates.');
  L.push('Be specific to this data. Do not invent facts that are not above.');
  return L.join('\n');
}
async function aiAsk(prompt){
  if(DESK)return window.desk.ai(prompt);
  const s=window.claude&&claude.use?await claude.use('sample'):null;
  if(!s)throw new Error('The built-in Claude analysis is not available in this view. Use Copy prompt and paste it into any AI you like.');
  const r=await s(prompt,{modelTier:'complex',cache:false});
  return r.text;
}
function aiTab(A){
  if(!AIS.loaded){aiLoad().then(()=>{if(V.view==='analysis'&&V.tab==='ai')renderAnalysis()});return '<div class="panel sub">Loading…</div>'}
  const P=store.papers.find(x=>x.id===A.paperId),prompt=buildAiPrompt(A,P);
  const form=DESK?`<div class="row" style="align-items:flex-end">
    <div class="field"><label for="aiprov">Provider</label><select id="aiprov">${['gemini','anthropic','openai'].map(k=>`<option value="${k}" ${AIS.provider===k?'selected':''}>${AI_LABEL[k]}</option>`).join('')}</select></div>
    <div class="field"><label for="aimodel">Model</label><input id="aimodel" value="${esc(/^gemini-2\.5-pro/.test(AIS.model||'')?'':(AIS.model||''))}" placeholder="${esc(AI_MODEL[AIS.provider]||'model name')}"></div>
    <div class="field"><label for="aiurl">Base URL (custom endpoints only)</label><input id="aiurl" value="${esc(AIS.baseUrl||'')}" placeholder="https://host/v1"></div>
    <div class="field"><label for="aikey">API key</label><input id="aikey" type="password" autocomplete="off" placeholder="${AIS.hasKey?'Saved. Leave blank to keep':'Paste API key'}"></div>
    <button class="btn" data-act="aisave">Save settings</button></div>
    <div class="sub" style="font-size:12px">Your key is stored encrypted on this computer by Windows and is only sent to the provider you pick.</div>`
   :`<div class="msg info">This page analyses with Claude directly. To use Gemini or another provider, use the Windows app.</div>`;
  return `<div class="panel stack"><div><h2>AI coach</h2><div class="sub">Sends your result data (scores, topics, timings, and the text of your costliest questions) to an AI and returns a written analysis and study plan.</div></div>
   ${form}
   <div class="row"><button class="btn pri" data-act="airun" ${V.aiBusy?'disabled':''}>${V.aiBusy?'Analysing… this can take a minute':(A.ai?'Run analysis again':'Analyse this attempt')}</button><button class="btn" data-act="aicopy">Copy prompt</button></div>
   ${V.aiErr?`<div class="msg err" style="white-space:pre-wrap">${esc(V.aiErr)}</div>`:''}
   ${A.ai?`<div class="aibox panel" style="background:var(--surface2)">${md(A.ai.text)}<div class="sub" style="font-size:12px;margin-top:12px">Generated ${fmtDate(A.ai.at)} with ${esc(A.ai.by)}</div></div>`:''}
   <details><summary>See exactly what will be sent</summary><pre class="prompt">${esc(prompt)}</pre></details>
   <div class="sub" style="font-size:12px">Copy prompt lets you paste the same text into any AI website, such as Gemini, if you prefer not to use an API key.</div></div>`;
}
acts.aisave=async()=>{
  const v=id=>(document.getElementById(id)||{}).value||'';
  try{const r=await window.desk.setSettings({provider:v('aiprov'),model:v('aimodel').trim(),baseUrl:v('aiurl').trim(),key:v('aikey').trim()});Object.assign(AIS,r);toast('Settings saved');V.aiErr='';renderAnalysis()}catch(e){V.aiErr=e.message||String(e);renderAnalysis()}
};
acts.aicopy=()=>{const A=store.attempts.find(x=>x.id===V.analysisId);if(A)copyText(buildAiPrompt(A,store.papers.find(x=>x.id===A.paperId)))};
acts.airun=async()=>{
  const A=store.attempts.find(x=>x.id===V.analysisId);if(!A)return;
  V.aiBusy=true;V.aiErr='';renderAnalysis();
  try{const text=await aiAsk(buildAiPrompt(A,store.papers.find(x=>x.id===A.paperId)));
    if(!text||!String(text).trim())throw new Error('The AI returned an empty answer.');
    A.ai={text:String(text),at:Date.now(),by:AI_LABEL[AIS.provider]+(DESK&&AIS.model?' · '+AIS.model:(DESK&&AI_MODEL[AIS.provider]?' · '+AI_MODEL[AIS.provider]:''))};store.save(A)}
  catch(e){V.aiErr=(e&&e.message)||String(e)}
  V.aiBusy=false;if(V.view==='analysis')renderAnalysis();
};
/* desktop backup */
acts.backup=async()=>{try{const ok=await window.desk.exportBackup(JSON.stringify({app:'cat-mock-desk',papers:store.papers,attempts:store.attempts}));toast(ok?'Backup saved':'Cancelled')}catch(e){toast('Backup failed')}};
acts.restore=async()=>{
  try{const txt=await window.desk.importBackup();if(!txt)return;const d=JSON.parse(txt);let n=0;
    [...(d.papers||[]),...(d.attempts||[])].forEach(x=>{if(x&&x.id&&(x.kind==='paper'||x.kind==='attempt')){const l=x.kind==='paper'?store.papers:store.attempts;if(!l.find(y=>y.id===x.id)){store.save(x);n++}}});
    store.papers.sort((a,b)=>b.created-a.created);store.attempts.sort((a,b)=>b.date-a.date);store.mirror();
    V.msg={t:'ok',m:n+' item'+(n===1?'':'s')+' restored.'}}catch(e){V.msg={t:'err',m:'That file is not a valid backup.'}}
  renderHome();
};

<script>
'use strict';
/* ---------- derived tests: one section only, practice by topic, retry mistakes ---------- */
function sectionOnly(p,si){
  const ex=store.papers.find(x=>x.derived&&x.srcPaper===p.id&&x.srcSec===si);if(ex)return ex;
  const qs=p.questions.filter(q=>q.sec===si).map((q,i)=>Object.assign({},q,{id:'q'+i,sec:0,srcKey:q.srcKey||p.id+':'+q.id}));
  const d={id:uid('p_'),kind:'paper',derived:true,srcPaper:p.id,srcSec:si,title:p.title+' · '+p.sections[si].name+' only',created:Date.now(),
    sections:[{name:p.sections[si].name,minutes:p.sections[si].minutes,count:qs.length}],questions:qs};
  store.save(d);return d;
}
function buildDerived(items,title,mins,secName){
  const qs=items.map((it,i)=>Object.assign({},it.q,{id:'q'+i,sec:0,srcKey:it.q.srcKey||it.key}));
  const d={id:uid('p_'),kind:'paper',derived:true,title,created:Date.now(),sections:[{name:secName,minutes:mins,count:qs.length}],questions:qs};
  store.save(d);return d;
}
function qPool(){const o=[];store.papers.filter(p=>!p.derived).forEach(p=>p.questions.forEach((q,i)=>o.push({p,q,i,key:p.id+':'+q.id,sec:p.sections[q.sec].name})));return o}
function lastStatus(){
  const m={};[...store.attempts].sort((a,b)=>a.date-b.date).forEach(a=>{const P=store.papers.find(x=>x.id===a.paperId);
    a.qs.forEach(x=>{const q=P&&P.questions[x.n-1];m[(q&&q.srcKey)||(a.paperId+':'+x.id)]=x.status})});return m;
}
function pbMatches(){
  const pb=V.pb,sm=lastStatus();
  return qPool().filter(it=>(!pb.topics.size||pb.topics.has(it.q.topic))&&(!pb.diffs.size||pb.diffs.has(it.q.difficulty))&&(!pb.secs.size||pb.secs.has(it.sec))
    &&(pb.src==='all'||(pb.src==='mistakes'?(sm[it.key]&&sm[it.key]!=='correct'):!sm[it.key])));
}
function renderPractice(){
  if(!V.pb)V.pb={topics:new Set(),diffs:new Set(),secs:new Set(),src:'all',count:20,mins:null,perq:2,pick:'auto',sel:new Set(),title:''};
  const pb=V.pb,all=qPool(),m=pbMatches(),sy=window.scrollY;
  const chosen=pb.pick==='manual'?m.filter(it=>pb.sel.has(it.key)):m.slice(0,Math.min(pb.count||1,m.length));
  const n=chosen.length,mins=pb.mins||Math.max(1,Math.round(n*(pb.perq||2)));
  const cnt=f=>{const c={};all.forEach(it=>{const k=f(it);c[k]=(c[k]||0)+1});return c};
  const chips=(kind,counts,sel)=>Object.keys(counts).sort().map(k=>`<button class="chip ${sel.has(k)?'on':''}" data-act="pbtoggle" data-kind="${kind}" data-v="${esc(k)}">${esc(k)} <span class="num">${counts[k]}</span></button>`).join('');
  const list=pb.pick==='manual'?`<div class="row" style="margin:6px 0"><button class="btn sm" data-act="pbselall">Select all shown</button><button class="btn sm" data-act="pbselnone">Clear selection</button><span class="sub">${n} selected of ${m.length}</span></div>
     <div style="max-height:420px;overflow:auto;border:1px solid var(--line);border-radius:12px">${m.slice(0,300).map(it=>`<label class="opt" style="border-bottom:1px solid var(--line);border-radius:0"><input type="checkbox" data-pbq="${esc(it.key)}" ${pb.sel.has(it.key)?'checked':''}><span><b class="num">${esc(it.sec)} ${it.i+1}</b> · ${esc(it.q.topic)}${it.q.sub?' › '+esc(it.q.sub):''} · ${it.q.difficulty}<br><span class="sub">${esc(it.q.text.replace(/\s+/g,' ').slice(0,110))}</span></span></label>`).join('')}</div>`:'';
  app.innerHTML=`<div class="wrap" style="max-width:900px"><div class="top"><div class="brand">DPP builder<small>daily practice</small></div><button class="btn" data-act="home">Back</button></div>
   ${all.length?`<div class="panel stack">
    <div class="sub">Build a short practice set from the questions in your papers. Choose how many questions, which ones, and how long you get. It runs on the same exam screen.</div>
    <div><h3>Section</h3><div class="chips">${chips('secs',cnt(it=>it.sec),pb.secs)}</div></div>
    <div><h3>Topic</h3><div class="chips">${chips('topics',cnt(it=>it.q.topic),pb.topics)}</div></div>
    <div><h3>Difficulty</h3><div class="chips">${chips('diffs',cnt(it=>it.q.difficulty),pb.diffs)}</div></div>
    <div><h3>Which questions</h3><div class="seg">${[['all','All'],['mistakes','Only my mistakes'],['fresh','Not attempted yet']].map(([k,l])=>`<button class="${pb.src===k?'on':''}" data-act="pbsrc" data-v="${k}">${l}</button>`).join('')}</div>
     <div class="sub" style="margin-top:6px">Mistakes means wrong, left blank or never opened the last time you saw it.</div></div>
    <div><h3>How to choose</h3><div class="seg">${[['auto','Pick for me'],['manual','I will choose the questions']].map(([k,l])=>`<button class="${pb.pick===k?'on':''}" data-act="pbpick" data-v="${k}">${l}</button>`).join('')}</div></div>
    ${pb.pick==='auto'?`<div class="field" style="max-width:180px"><label for="pbcount">Number of questions</label><input id="pbcount" type="number" min="1" max="200" value="${pb.count}"></div>`:list}
    <div class="row"><div class="field" style="max-width:150px"><label for="pbmins">Total minutes</label><input id="pbmins" type="number" min="1" max="300" value="${mins}"></div>
     <div class="field" style="max-width:170px"><label for="pbperq">or minutes per question</label><input id="pbperq" type="number" min="0.5" max="20" step="0.5" value="${pb.perq}"></div>
     <div class="field"><label for="pbtitle">Set name (optional)</label><input id="pbtitle" value="${esc(pb.title)}" placeholder="DPP ${new Date().toLocaleDateString(undefined,{day:'numeric',month:'short'})}" maxlength="80"></div></div>
    <div class="sub" style="font-size:12px">You can still switch to a stopwatch or turn on instant answer checking on the next screen.</div>
    <div class="msg ${n?'info':'err'}">${n?n+' question'+(n>1?'s':'')+' selected, '+mins+' minutes.':(pb.pick==='manual'?'Tick at least one question.':'No questions match these filters.')}</div>
    <div class="row"><button class="btn pri" data-act="pbstart" ${n?'':'disabled'}>Build and start</button></div></div>`
   :`<div class="panel"><p class="sub">Add at least one paper first. Questions are drawn from your uploaded papers.</p></div>`}</div>`;
  window.scrollTo(0,sy);
}
acts.practice=()=>go('practice');
acts.pbtoggle=t=>{const set=V.pb[t.dataset.kind],v=t.dataset.v;set.has(v)?set.delete(v):set.add(v);renderPractice()};
acts.pbsrc=t=>{V.pb.src=t.dataset.v;renderPractice()};
acts.pbpick=t=>{V.pb.pick=t.dataset.v;renderPractice()};
acts.pbselall=()=>{pbMatches().forEach(it=>V.pb.sel.add(it.key));renderPractice()};
acts.pbselnone=()=>{V.pb.sel.clear();renderPractice()};
acts.pbstart=()=>{
  const pb=V.pb;let m=pbMatches();if(!m.length)return;
  if(pb.pick==='manual')m=m.filter(it=>pb.sel.has(it.key));
  else{for(let i=m.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[m[i],m[j]]=[m[j],m[i]]}m=m.slice(0,Math.min(pb.count||1,m.length))}
  if(!m.length)return;
  m.sort((a,b)=>a.p.id===b.p.id?a.i-b.i:(a.p.id<b.p.id?-1:1));
  const mins=pb.mins||Math.max(1,Math.round(m.length*(pb.perq||2)));
  const tp=[...pb.topics];
  const title=(pb.title||'').trim()||('DPP: '+(tp.length?tp.slice(0,3).join(', ')+(tp.length>3?'…':''):'mixed topics')+' · '+m.length+' Q');
  const d=buildDerived(m,title,mins,tp.length===1?tp[0]:'Practice');
  V.paperId=d.id;V.mode='cat';V.scope='all';V.tmv=null;V.untimed=false;V.instant=false;go('instr');
};
acts.retry=t=>{
  const A=store.attempts.find(x=>x.id===t.dataset.id),P=A&&store.papers.find(x=>x.id===A.paperId);if(!A||!P)return;
  const items=A.qs.filter(x=>x.status!=='correct').map(x=>({q:P.questions[x.n-1],key:P.id+':'+x.id})).filter(it=>it.q);
  if(!items.length)return;
  const d=buildDerived(items,'Retry: '+A.title+' · '+items.length+' Q',Math.max(5,items.length*2),'Retry');
  V.paperId=d.id;V.mode='cat';V.scope='all';V.tmv=null;V.untimed=false;V.instant=false;go('instr');
};
app.addEventListener('change',e=>{
  const t=e.target;if(V.view!=='practice'||!V.pb)return;const pb=V.pb;
  if(t.id==='pbcount'){pb.count=Math.max(1,Math.min(200,parseInt(t.value)||1));pb.mins=null;renderPractice()}
  else if(t.id==='pbmins'){pb.mins=Math.max(1,Math.min(300,parseInt(t.value)||1));renderPractice()}
  else if(t.id==='pbperq'){pb.perq=Math.max(0.5,Math.min(20,parseFloat(t.value)||2));pb.mins=null;renderPractice()}
  else if(t.id==='pbtitle'){pb.title=t.value}
  else if(t.dataset.pbq!=null){t.checked?pb.sel.add(t.dataset.pbq):pb.sel.delete(t.dataset.pbq);renderPractice()}
});
</script>

<script>
'use strict';
/* ---------- log an attempt made elsewhere ---------- */
function renderLog(){
  const p=store.papers.find(x=>x.id===V.logPaper);if(!p){go('home');return}
  if(!V.log||V.log.paperId!==p.id)V.log={paperId:p.id,date:new Date().toISOString().slice(0,10),rows:{},showTime:false,msg:null};
  const L=V.log;
  const secs=p.sections.map((s,si)=>{
    const rows=p.questions.map((q,i)=>q.sec===si?i:-1).filter(i=>i>=0).map(i=>{
      const q=p.questions[i],r=L.rows[i]||{};
      const inp=q.type==='mcq'
        ?`<select class="tag" data-lg="${i}" data-f="ans" aria-label="Answer for question ${i+1}"><option value="">—</option>${q.options.map((o,k)=>`<option value="${k}" ${String(r.ans)===String(k)?'selected':''}>${String.fromCharCode(65+k)}</option>`).join('')}</select>`
        :`<input class="nm" data-lg="${i}" data-f="ans" value="${esc(r.ans||'')}" placeholder="type answer" style="width:130px" aria-label="Answer for question ${i+1}">`;
      return `<tr><td class="num">${i+1}</td><td>${esc(q.topic)}${q.sub?' › '+esc(q.sub):''}</td><td>${q.type==='mcq'?'MCQ':'TITA'}</td><td>${inp}</td>${L.showTime?`<td><input class="nm" type="number" min="0" data-lg="${i}" data-f="sec" value="${esc(r.sec||'')}" placeholder="sec" style="width:84px" aria-label="Seconds on question ${i+1}"></td>`:''}</tr>`}).join('');
    return `<div class="panel" style="margin-top:14px"><h3>${esc(s.name)}</h3><div class="tablewrap"><table class="hist"><thead><tr><th>#</th><th>Topic</th><th>Type</th><th>Your answer</th>${L.showTime?'<th>Seconds</th>':''}</tr></thead><tbody>${rows}</tbody></table></div></div>`}).join('');
  app.innerHTML=`<div class="wrap" style="max-width:900px"><div class="top"><div class="brand">Log a past attempt<small>${esc(p.title)}</small></div><button class="btn" data-act="home">Back</button></div>
   <div class="panel stack"><div class="sub">Enter the answers you gave when you took this paper elsewhere. Leave a question empty if you skipped it. The paper's answer key then scores it and builds the full analysis.</div>
    <div class="row"><div class="field" style="max-width:190px"><label for="lgdate">Date taken</label><input id="lgdate" type="date" value="${esc(L.date)}"></div>
     <label class="row" style="gap:6px"><input type="checkbox" id="lgtime" ${L.showTime?'checked':''}> I also know the time spent on each question</label></div>
    <div><label for="lgpaste" class="sub">Quick fill: paste answers numbered by question, for example <span class="mono">1 B, 2 C, 3 -, 17 3412</span> (use - for skipped)</label>
     <textarea class="paste" id="lgpaste" placeholder="1 B&#10;2 C&#10;3 -&#10;4 3412"></textarea><div class="row" style="margin-top:6px"><button class="btn" data-act="lgapply">Apply pasted answers</button></div></div>
    ${L.msg?`<div class="msg ${L.msg.t}">${esc(L.msg.m)}</div>`:''}</div>
   ${secs}
   <div class="row" style="margin-top:16px"><button class="btn pri" data-act="lgsave">Save and see analysis</button><button class="btn" data-act="home">Cancel</button></div></div>`;
}
acts.logpast=t=>{V.logPaper=t.dataset.id;V.log=null;go('log')};
acts.lgapply=()=>{
  const p=store.papers.find(x=>x.id===V.logPaper),L=V.log,txt=(document.getElementById('lgpaste')||{}).value||'';if(!p)return;
  const re=/(?:q\s*)?(\d{1,3})(?:\s*[:.)=]\s*|\s+|-(?=[A-Za-z\d]))(skip|[A-Za-z]|-?\d+(?:\.\d+)?|-)(?![A-Za-z])/gi;let m,n=0;
  while((m=re.exec(txt))){
    const i=+m[1]-1;if(i<0||i>=p.questions.length)continue;const q=p.questions[i];let tok=m[2];
    const blank=/^(skip|-)$/i.test(tok);
    if(q.type==='mcq'){const k=blank?'':tok.toUpperCase().charCodeAt(0)-65;if(blank)L.rows[i]=Object.assign(L.rows[i]||{},{ans:''});else if(/^[A-Za-z]$/.test(tok)&&k<q.options.length)L.rows[i]=Object.assign(L.rows[i]||{},{ans:String(k)});else continue}

acts.lgsave=()=>{
  const p=store.papers.find(x=>x.id===V.logPaper),L=V.log;if(!p||!L)return;

    if(given!=null)any=true;
    const time=Math.max(0,Math.round(+r.sec||0));if(time>0)anyTime=true;
